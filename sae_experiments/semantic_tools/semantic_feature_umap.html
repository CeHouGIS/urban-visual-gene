<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAE 维度语义图谱</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0c1220;color:#edf1f8}body{margin:0}header{padding:22px 28px;border-bottom:1px solid #2a3548}h1{font-size:23px;margin:0 0 8px}p{line-height:1.6;color:#a8b6cb;margin:5px 0}main{display:grid;grid-template-columns:minmax(360px,45%) 1fr;gap:20px;padding:20px}.plot{position:sticky;top:15px;align-self:start}canvas{width:100%;height:65vh;background:#111d30;border:1px solid #304158;border-radius:12px;touch-action:none}button,input{background:#19283e;color:#edf1f8;border:1px solid #3d526b;border-radius:6px;padding:8px;margin:5px}button{cursor:pointer}#examples{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.card{background:#142036;border:1px solid #2b3e56;border-radius:10px;overflow:hidden}.card img{width:100%;height:145px;object-fit:contain;background:#080e19}.card div{padding:10px;font-size:12px;overflow-wrap:anywhere}.muted{color:#a8b6cb}#tip{min-height:30px;margin:8px}h2{font-size:20px}a{color:#80d5ef}#detail{min-width:0}@media(max-width:850px){main{grid-template-columns:1fr}.plot{position:static}canvas{height:50vh}}
</style>
<header><h1>SAE 维度的语义 UMAP</h1><p id="summary"></p><p>每个点代表一个 SAE 维度；坐标来自高激活区域的图像语义 embedding。颜色表示实例间的 embedding 一致性，类别尚未人工确认。</p></header>
<main><section class="plot"><canvas id="plot"></canvas><div id="tip">点击维度查看裁剪实例；滚轮缩放，拖动平移。</div><button id="reset">重置视图</button><input id="feature" type="number" min="0" placeholder="维度编号"><button id="jump">查看维度</button><p>较暗的点表示实例一致性较低。未满足支持量的维度仍可通过编号查阅。</p></section><section id="detail"><h2 id="title">选择一个维度</h2><p id="stats"></p><div id="examples"></div></section></main>
<script>
const atlas=__ATLAS_DATA__;
const canvas=document.getElementById('plot'),ctx=canvas.getContext('2d');
const points=atlas.points.filter(p=>p.x!==null),byId=new Map(atlas.points.map(p=>[p.feature,p]));
document.getElementById('summary').textContent=atlas.dataset+' · '+points.length+'/'+atlas.points.length+' 个维度进入投影 · '+atlas.model;
let selected=null,scale=1,panX=0,panY=0,width=1,height=1,drag=null;
const xs=points.map(p=>p.x),ys=points.map(p=>p.y),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
function pos(p){return [(30+(p.x-minX)/(maxX-minX||1)*(width-60))*scale+panX,(30+(p.y-minY)/(maxY-minY||1)*(height-60))*scale+panY]}
function draw(){ctx.clearRect(0,0,width,height);for(const p of points){const [x,y]=pos(p);ctx.beginPath();ctx.arc(x,y,p.feature===selected?7:3.5,0,Math.PI*2);ctx.fillStyle=`hsl(${190-p.coherence*50} 75% ${25+p.coherence*40}%)`;ctx.fill();if(p.feature===selected){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.fillText('f'+p.feature,x+10,y-6)}}}
function resize(){const r=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;width=r.width;height=r.height;canvas.width=width*dpr;canvas.height=height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function nearest(x,y){let best=null,distance=12;for(const p of points){const [px,py]=pos(p),d=Math.hypot(x-px,y-py);if(d<distance){best=p;distance=d}}return best}
function select(id){const p=byId.get(id);if(!p)return;selected=id;document.getElementById('feature').value=id;document.getElementById('title').textContent='维度 '+id;document.getElementById('stats').textContent=p.count+' 个裁剪实例 · embedding 一致性 '+p.coherence.toFixed(3)+(p.x===null?' · 支持不足，未进入 UMAP':'')+'。名称需结合实例验证。';const el=document.getElementById('examples');el.replaceChildren();for(const ex of p.examples){const card=document.createElement('article');card.className='card';const a=document.createElement('a');a.href=ex.crop;a.target='_blank';a.rel='noopener';const img=document.createElement('img');img.src=ex.crop;img.loading='lazy';img.alt='维度 '+id+' 的第 '+ex.rank+' 个高激活区域';a.append(img);const text=document.createElement('div');text.textContent='#'+ex.rank+' · '+ex.city+' · '+ex.heading+'°\n激活 '+ex.activation.toPrecision(4)+'\n'+ex.pano;text.style.whiteSpace='pre-line';card.append(a,text);el.append(card)}draw()}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.offsetX,y:e.offsetY,px:panX,py:panY,moved:false}});
canvas.addEventListener('pointermove',e=>{if(drag){const dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;if(Math.hypot(dx,dy)>4)drag.moved=true;panX=drag.px+dx;panY=drag.py+dy;draw()}else{const p=nearest(e.offsetX,e.offsetY);document.getElementById('tip').textContent=p?'维度 '+p.feature+' · '+p.count+' 个实例 · 一致性 '+p.coherence.toFixed(3):'点击维度查看实例；滚轮缩放，拖动平移。'}});
canvas.addEventListener('pointerup',e=>{if(drag&&!drag.moved){const p=nearest(e.offsetX,e.offsetY);if(p)select(p.feature)}drag=null});canvas.addEventListener('pointercancel',()=>drag=null);
canvas.addEventListener('wheel',e=>{e.preventDefault();const next=Math.min(12,Math.max(.4,scale*Math.exp(-e.deltaY*.001))),factor=next/scale;panX=e.offsetX-(e.offsetX-panX)*factor;panY=e.offsetY-(e.offsetY-panY)*factor;scale=next;draw()},{passive:false});
document.getElementById('reset').onclick=()=>{scale=1;panX=panY=0;draw()};document.getElementById('jump').onclick=()=>select(Number(document.getElementById('feature').value));window.addEventListener('resize',resize);resize();if(points.length)select(points[0].feature);
</script></html>
