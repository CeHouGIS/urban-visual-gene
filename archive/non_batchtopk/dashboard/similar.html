<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Visual Gene · 相似街景浏览</title>
<style>
:root{--bg:#070b14;--panel:#0f1828;--panel2:#121e33;--border:#1e2d47;
  --text:#dbe4f0;--muted:#8a9bb5;--accent:#39d6ff;--accent2:#7c5cff;--accent3:#22e0a1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:0 18px;height:52px;
  background:rgba(7,11,20,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{font-weight:700;display:flex;align-items:center;gap:9px;font-size:15px}
.brand .dot{width:10px;height:10px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--accent),var(--accent2),var(--accent3),var(--accent));box-shadow:0 0 12px var(--accent)}
.tab{font-size:13px;color:var(--muted);text-decoration:none;padding:6px 11px;border:1px solid var(--border);border-radius:8px}
.tab:hover{color:var(--text)}
.spacer{flex:1}
.ctrl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ctrl input[type=range]{accent-color:var(--accent);width:150px}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:var(--muted);border:0;padding:6px 11px;cursor:pointer;font-size:12px}
.seg button.active{background:var(--accent);color:#04121a;font-weight:700}
.cityseg button.active{background:var(--accent2);color:#fff}
.wrap{max-width:1320px;margin:0 auto;padding:18px}
#stat{color:var(--muted);font-size:13px;margin-bottom:12px}
#grid{display:grid;gap:14px}
#grid.one{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
#grid.four{grid-template-columns:1fr}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px}
.card .hd{font-size:12px;color:var(--muted);margin-bottom:7px}
.card .hd b{color:var(--accent);font-variant-numeric:tabular-nums}
.pair{display:flex;gap:8px;align-items:stretch}
.side{display:flex;gap:4px;flex:1;min-width:0}
.side .who{writing-mode:vertical-lr;font-size:10px;color:var(--muted);text-align:center}
.divider{width:1px;background:var(--border);flex:none}
.imgs{display:grid;gap:3px;flex:1;min-width:0}
.imgs.n1{grid-template-columns:1fr}
.imgs.n4{grid-template-columns:repeat(4,1fr)}
.cell{position:relative}
.cell img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px;background:#0b1322;display:block;cursor:zoom-in}
.cell .d{position:absolute;top:2px;left:3px;font-size:9px;color:#fff;background:rgba(0,0,0,.6);padding:0 4px;border-radius:3px}
.cell .s{position:absolute;top:2px;right:3px;font-size:10px;font-weight:700;color:#04121a;background:var(--accent);padding:0 4px;border-radius:3px}
#more{display:block;margin:22px auto;background:var(--panel2);color:var(--accent);border:1px solid var(--border);
  border-radius:9px;padding:10px 26px;font-size:14px;cursor:pointer}
#lb{position:fixed;inset:0;background:rgba(3,6,12,.94);z-index:200;display:none;align-items:center;justify-content:center;cursor:zoom-out}
#lb img{max-width:94vw;max-height:92vh;border-radius:8px}
#loading{padding:60px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="top">
  <div class="brand"><span class="dot"></span>相似街景浏览</div>
  <a class="tab" href="index.html">← 地图</a>
  <div class="cityseg seg" id="cityseg">
    <button data-city="Vienna" class="active">维也纳</button>
    <button data-city="HongKong" title="香港特征仍在提取,完成后可用">香港(待)</button>
  </div>
  <div class="spacer"></div>
  <div class="ctrl">相似度区间
    <b id="thv" style="color:var(--accent)">0.85</b>
    <input type="range" id="th" min="0" max="0.95" step="0.01" value="0.85">
    –
    <b id="thmaxv" style="color:var(--accent)">0.95</b>
    <input type="range" id="thmax" min="0" max="0.95" step="0.01" value="0.95"></div>
  <div class="seg" id="viewseg">
    <button data-n="1" class="active">1 视图</button>
    <button data-n="4">4 视图</button>
  </div>
</div>

<div class="wrap">
  <div id="stat"></div>
  <div id="grid" class="one"></div>
  <button id="more" style="display:none">加载更多</button>
  <div id="loading">加载相似对…</div>
</div>
<div id="lb" onclick="this.style.display='none'"><img id="lbimg" src=""></div>

<script src="config.js"></script>
<script>
const IMGB=(new URLSearchParams(location.search).get('img')||window.IMG_BASE||'').replace(/\/$/,'');
const DATA="data/";
let CITY="Vienna", DB=null, MINCOS=0.85, MAXCOS=0.95, NVIEW=1, shown=0, filtered=[];
const PAGE=80;

function panoURL(city,id,h){return city==="Vienna"
  ?`${IMGB}/data/SVIs/GSV/images/Austria/Vienna/${id[0]}/${id[1]}/${id}/${id}_${h}.jpg`
  :`${IMGB}/data/SVIs/GSV/images/China/HongKong/${id[0].toLowerCase()}/${id[1].toLowerCase()}/${id[2].toLowerCase()}/${id}_${h}.jpg`;}
function openLB(u){const lb=document.getElementById('lb');document.getElementById('lbimg').src=u;lb.style.display='flex';}

function side(id,cosh){const hs=NVIEW===1?[0]:[0,90,180,270];
  return `<div class="imgs n${NVIEW}">`+hs.map((h,k)=>`<div class="cell"><span class="d">${h}°</span>`+
    `<span class="s" title="该方向与对面同方向图的余弦相似度">${(cosh[k]!=null?cosh[k]:0).toFixed(2)}</span>`+
    `<img loading="lazy" src="${panoURL(CITY,id,h)}" onclick="openLB('${panoURL(CITY,id,h)}')" onerror="this.style.opacity=.12"></div>`).join('')+`</div>`;}
function card(p){const a=DB.ids[p[0]],b=DB.ids[p[1]],cosh=p.slice(4);   // [c0,c90,c180,c270]
  return `<div class="card"><div class="hd">整体余弦 <b>${p[2].toFixed(3)}</b> · ${p[3].toFixed(0)}m · <span style="color:var(--muted)">右上角=各方向相似度</span></div>`+
    `<div class="pair">${side(a,cosh)}<div class="divider"></div>${side(b,cosh)}</div></div>`;}

function applyFilter(){filtered=DB.pairs.filter(p=>p[2]>=MINCOS&&p[2]<=MAXCOS);shown=0;
  document.getElementById('grid').innerHTML="";renderMore();
  document.getElementById('stat').innerHTML=`相似度 ∈ [<b style="color:var(--accent3)">${MINCOS.toFixed(2)}</b>, <b style="color:var(--accent3)">${MAXCOS.toFixed(2)}</b>] 的对:${filtered.length.toLocaleString()} / ${DB.pairs.length.toLocaleString()}(按相似度降序)`;}
function renderMore(){const g=document.getElementById('grid');
  const slice=filtered.slice(shown,shown+PAGE);
  g.insertAdjacentHTML('beforeend',slice.map(card).join(""));shown+=slice.length;
  document.getElementById('more').style.display=shown<filtered.length?"block":"none";}

async function load(city){
  CITY=city;document.getElementById('loading').style.display='block';
  document.getElementById('grid').innerHTML="";
  DB=await fetch(DATA+`sim_pairs_${city}.json?v=${Date.now()}`,{cache:"no-store"}).then(r=>r.json());
  document.getElementById('loading').style.display='none';
  applyFilter();
}
document.getElementById('th').addEventListener('input',e=>{MINCOS=+e.target.value;
  document.getElementById('thv').textContent=MINCOS.toFixed(2);applyFilter();});
document.getElementById('thmax').addEventListener('input',e=>{MAXCOS=+e.target.value;
  document.getElementById('thmaxv').textContent=MAXCOS.toFixed(2);applyFilter();});
document.getElementById('viewseg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#viewseg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  NVIEW=+b.dataset.n;document.getElementById('grid').className=NVIEW===1?'one':'four';applyFilter();});
document.getElementById('cityseg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.city==="HongKong"){alert("香港特征仍在提取中,完成后可用");return;}
  document.querySelectorAll('#cityseg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');load(b.dataset.city);});
document.getElementById('more').addEventListener('click',renderMore);
load("Vienna");
</script>
</body>
</html>
