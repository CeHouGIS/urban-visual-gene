<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>W1024 Statistical Taxonomy</title>
<style>
:root{--bg:#070b14;--panel:#0d1626;--panel2:#121f34;--line:#20314d;--text:#dbe4f0;--muted:#8a9bb5;--cyan:#39d6ff;--green:#22e0a1;--yellow:#f6c945;--red:#ff7488;--purple:#a58bff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}
header{height:55px;display:flex;align-items:center;gap:13px;padding:0 17px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;background:#070b14ee;backdrop-filter:blur(10px)}
h1{font-size:17px;margin:0}.grow{flex:1}.muted{color:var(--muted)}.btn,button,select,input{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit}.btn{font-size:12px}.layout{display:grid;grid-template-columns:370px 1fr;min-height:calc(100vh - 55px)}
aside{padding:12px;border-right:1px solid var(--line);max-height:calc(100vh - 55px);overflow:auto;position:sticky;top:55px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}.filters input{grid-column:1/-1}.tree-head{font-size:10px;color:var(--cyan);letter-spacing:1px;margin:10px 4px 6px}.node>.row{display:flex;align-items:center;gap:7px;padding:6px;border-radius:7px;cursor:pointer;font-size:12px}.row:hover,.row.active{background:var(--panel2)}.toggle{width:13px;color:var(--muted)}.name{flex:1}.count{color:var(--muted);font-size:10px}.kids{display:none;margin-left:12px;border-left:1px solid var(--line);padding-left:5px}.kids.open{display:block}
main{padding:18px;min-width:0}.empty{padding:50px;color:var(--muted)}.headline{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.headline h2{margin:0}.tag{display:inline-block;padding:2px 8px;border-radius:12px;background:#182943;color:var(--muted);font-size:10px}.tag.good{color:var(--green)}.tag.warn{color:var(--yellow)}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0 15px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:10px;color:var(--muted)}.kpi b{display:block;font-size:16px;color:var(--cyan)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px}.card{border:1px solid var(--line);background:var(--panel);border-radius:9px;overflow:hidden;cursor:pointer}.card:hover{border-color:var(--cyan)}.card-media,.no-image{width:100%;aspect-ratio:1}.card-media img{width:100%;height:100%;object-fit:cover;display:block;background:#0a1220}.no-image{display:grid;place-items:center;padding:12px;text-align:center;background:repeating-linear-gradient(135deg,#0a1220,#0a1220 10px,#0d1727 10px,#0d1727 20px);color:var(--muted);font-size:10px}.no-image[hidden]{display:none}.card .cap{padding:6px;font-size:10px;color:var(--muted)}.card .cap b{font-size:12px;color:white}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:13px}.box h3{font-size:12px;color:var(--cyan);margin:0 0 9px}.metric{display:grid;grid-template-columns:190px 1fr 65px;gap:7px;font-size:11px;align-items:center;margin:6px 0}.bar{height:7px;background:#17263e;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan))}.rels{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px}.rel{border:1px solid var(--line);border-radius:7px;padding:7px;font-size:11px;cursor:pointer}.rel:hover{border-color:var(--cyan)}.examples{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.examples img{width:100%;border-radius:8px;aspect-ratio:1;object-fit:cover}
.note{color:var(--muted);font-size:12px;line-height:1.65;margin:8px 0 14px}.role{color:var(--green)}table{width:100%;border-collapse:collapse;font-size:11px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:6px}th{color:var(--muted)}
.tree-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:10px 0}.tree-tools button.active{border-color:var(--cyan);color:var(--cyan)}.tree-workspace{display:grid;grid-template-columns:minmax(570px,1.7fr) minmax(245px,.75fr);gap:12px;margin:12px 0 18px}.tree-panel{border:1px solid var(--line);background:var(--panel);border-radius:10px;overflow:hidden}.tree-legend{display:flex;gap:13px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:10px}.tree-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.tree-scroll{max-height:72vh;min-height:360px;overflow:auto;background:radial-gradient(circle at 15% 20%,#11213a55,transparent 38%)}#lineageTree{display:block;min-width:820px}.tree-link{fill:none;stroke:#29405f;stroke-width:1.2}.vnode{cursor:pointer}.vnode circle{stroke:#07101d;stroke-width:2;transition:r .12s,stroke .12s}.vnode:hover circle,.vnode.selected circle{r:9;stroke:white}.vnode text{font-size:11px;fill:var(--text);dominant-baseline:middle}.vnode .node-meta{font-size:9px;fill:var(--muted)}.vnode.root circle{fill:var(--purple)}.vnode.coarse circle{fill:var(--cyan)}.vnode.fine circle{fill:var(--green)}.vnode.gene circle{fill:var(--yellow)}.branch-mark{stroke:#07101d;stroke-width:1.5;pointer-events:none}.tree-inspector{position:sticky;top:73px;align-self:start;min-height:210px}.tree-inspector .card{max-width:180px;margin-top:10px}.tree-inspector h3{font-size:14px;color:white}.tree-inspector .inspect-path{font-size:10px;color:var(--cyan);word-break:break-all}.tree-inspector button{margin-top:8px}
.cut-summary{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:8px;margin:9px 0 12px}.cut-verdict{border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--muted);font-size:10px}.cut-verdict b{display:block;color:var(--cyan);font-size:20px}.cut-scroll{overflow:auto;max-height:470px;border:1px solid var(--line);border-radius:8px}.cut-scroll table{min-width:940px}.cut-scroll th{position:sticky;top:0;background:#111d30;z-index:1}.cut-scroll tr.pick-coarse{background:#173044}.cut-scroll tr.pick-fine{background:#15372e}.cut-scroll tr.fragment{color:#c999a2}.cut-scroll td:first-child,.cut-scroll th:first-child{position:sticky;left:0;background:inherit}.regime{font-size:9px;padding:2px 6px;border-radius:9px;background:#1a2940;color:var(--muted)}
@media(max-width:1150px){.tree-workspace{grid-template-columns:1fr}.tree-inspector{position:static}}@media(max-width:950px){.layout{display:block}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}.grid2{grid-template-columns:1fr}.tree-workspace{grid-template-columns:1fr}}
</style></head><body>
<header><h1>BatchTopK W1024/K8 · Statistical Taxonomy</h1><span class="tag">无人工 · 无 VLM</span><span class="grow"></span><button class="btn" onclick="showRoot()">谱系树</button><a class="btn" href="w1024_structure.html">结构审计</a><a class="btn" href="genes.html">基因浏览器</a></header>
<div class="layout"><aside>
 <div class="filters"><input id="search" placeholder="Gene / C / F 编号" oninput="updateTrees()"><select id="role" onchange="updateTrees()"><option value="">全部统计角色</option></select><select id="level" onchange="updateTrees()"><option value="">全部粒度</option></select></div>
 <div class="tree-head">STATISTICAL HIERARCHY · 32 COARSE / 64 FINE</div><div id="tree"></div>
</aside><main id="detail"><div class="empty">正在加载统计 taxonomy……</div></main></div>
<script>
let S,T,M,R,E,H,ACTIVE=null,TREE_SELECTED="ROOT";const TREE_OPEN=new Set(["ROOT"]);const byId=id=>M[String(id)],fmt=x=>Number(x).toFixed(3);const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
Promise.all([fetch("w1024_statistical/summary.json").then(x=>x.json()),fetch("w1024_statistical/taxonomy.json").then(x=>x.json()),fetch("w1024_statistical/gene_metrics.json").then(x=>x.json()),fetch("w1024_statistical/gene_relations.json").then(x=>x.json()),fetch("genes_batchtopk_w1024_k8/manifest.json").then(x=>x.json()),fetch("w1024_statistical/hierarchy_comparison.json").then(x=>x.json())]).then(x=>{[S,T,M,R,E,H]=x;role.innerHTML+=[...new Set(Object.values(M).map(g=>g.statistical_role))].sort().map(x=>`<option>${x}</option>`).join("");level.innerHTML+=[...new Set(Object.values(M).map(g=>g.granularity_level))].sort().map(x=>`<option>${x}</option>`).join("");buildTree();showRoot()}).catch(e=>detail.innerHTML=`<div class="empty">加载失败：${e}<br>请从 formal/site 目录启动 HTTP server。</div>`);
function allowed(id){const g=byId(id),q=search.value.trim().toUpperCase();return(!role.value||g.statistical_role===role.value)&&(!level.value||g.granularity_level===level.value)&&(!q||String(id).includes(q)||g.coarse_cluster.includes(q)||g.fine_cluster.includes(q))}
function branchGenes(b){return b.genes||b.children.flatMap(x=>x.genes)}function visGenes(b){return branchGenes(b).filter(allowed)}
function updateTrees(){buildTree();if(document.getElementById("lineageTree"))drawLineageTree()}
function buildTree(){if(!T)return;tree.innerHTML="";T.children.filter(c=>visGenes(c).length).forEach(c=>tree.appendChild(node(c,true)))}
function node(n,coarse){const wrap=document.createElement("div");wrap.className="node";const row=document.createElement("div");row.className="row";row.innerHTML=`<span class="toggle">▶</span><span class="name">${n.id}</span><span class="count">${visGenes(n).length}/${n.n}</span>`;const kids=document.createElement("div");kids.className="kids";row.onclick=()=>{setActive(row);kids.classList.toggle("open");row.querySelector(".toggle").textContent=kids.classList.contains("open")?"▼":"▶";if(!kids.dataset.ready){kids.dataset.ready=1;(coarse?n.children.filter(x=>visGenes(x).length).map(x=>node(x,false)):visGenes(n).map(g=>geneNode(g))).forEach(x=>kids.appendChild(x))}showCluster(n)};wrap.append(row,kids);return wrap}
function geneNode(id){const w=document.createElement("div");w.className="node";const r=document.createElement("div");r.className="row";const g=byId(id);r.innerHTML=`<span class="toggle"></span><span class="name">Gene #${id}</span><span class="count">${g.granularity_level}</span>`;r.onclick=()=>{setActive(r);showGene(id)};w.append(r);return w}
function setActive(x){if(ACTIVE)ACTIVE.classList.remove("active");ACTIVE=x;x.classList.add("active")}
function rep(id){const e=E.genes[String(id)];return e?.ex?.[0]||""}function card(id){const g=byId(id),im=rep(id),media=im?`<div class="card-media"><img loading="lazy" src="${im}" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="no-image" hidden>图片加载失败</div></div>`:'<div class="no-image">暂无 exemplar<br>该 gene 未达到旧展示阈值</div>';return`<div class="card" onclick="showGene(${id})">${media}<div class="cap"><b>#${id}</b> · ${g.granularity_level}<br>${g.statistical_role}<br>${g.fine_cluster} · stability ${fmt(g.split_stability)}</div></div>`}
function showRoot(){if(!S)return;detail.innerHTML=`<div class="headline"><h2>Statistical Lineage Tree</h2><span class="tag">${S.n_genes} genes</span><span class="tag">ROOT → C → F → Gene</span></div><p class="note">这是一棵由五视图融合统计得到的真实父子树。点击圆点展开或收起分支，点击后右侧同步显示节点信息；C/F 编号表示统计模块，不声明自然语言语义。</p><div class="tree-tools"><button onclick="treePreset('root')">只看 ROOT</button><button onclick="treePreset('coarse')">展开粗类</button><button onclick="treePreset('fine')">展开到细类</button><span class="muted">单个 F 节点可继续展开到 Gene</span></div><div class="tree-workspace"><div class="tree-panel"><div class="tree-legend"><span><i style="background:var(--purple)"></i>ROOT</span><span><i style="background:var(--cyan)"></i>C 粗模块</span><span><i style="background:var(--green)"></i>F 细模块</span><span><i style="background:var(--yellow)"></i>Gene</span></div><div class="tree-scroll"><svg id="lineageTree" role="img" aria-label="W1024 statistical lineage tree"></svg></div></div><div id="treeInspector" class="box tree-inspector"></div></div>${renderCutComparison()}<div class="kpis"><div class="kpi"><b>${S.coarse_clusters}</b>coarse modules</div><div class="kpi"><b>${S.fine_clusters}</b>fine modules</div><div class="kpi"><b>${S.granularity_levels}</b>粒度层</div><div class="kpi"><b>${S.fused_graph_components}</b>融合图连通分量</div></div><div class="grid2"><div class="box"><h3>统计角色</h3>${Object.entries(S.role_counts).map(([k,v])=>metric(k,v,S.n_genes)).join("")}</div><div class="box"><h3>经验关系</h3>${Object.entries(S.relation_counts).map(([k,v])=>metric(k,v,Math.max(...Object.values(S.relation_counts)))).join("")}</div></div>`;requestAnimationFrame(()=>{drawLineageTree();inspectTreeNode({key:"ROOT",kind:"root",node:T,depth:0},false)})}
function cutRegime(k){if(k<28)return"欠分";if(k<=40)return"粗层平台";if(k<=96)return"细层平台";return"开始碎片化"}
function renderCutComparison(){const q=H.recommendation,rows=H.rows.map(r=>{const cls=r.k===q.coarse_k?'pick-coarse':r.k===q.fine_k?'pick-fine':r.k>=q.fragmentation_starts_at?'fragment':'';return`<tr class="${cls}"><td><b>K=${r.k}</b></td><td><span class="regime">${cutRegime(r.k)}</span></td><td>${fmt(r.silhouette)}</td><td>${r.calinski_harabasz.toFixed(1)}</td><td>${fmt(r.davies_bouldin)}</td><td>${fmt(r.size_entropy)}</td><td>${r.min_size} / ${r.median_size} / ${r.max_size}</td><td>${fmt(r.split_jaccard)}</td><td>${fmt(r.split_ari)}</td><td>${(100*r.small_cluster_fraction).toFixed(1)}%</td></tr>`}).join("");return`<div class="box"><h3>粗分 / 细分完整 K 对比</h3><div class="cut-summary"><div class="cut-verdict"><b>K=${q.coarse_k}</b>推荐粗层<br>分离度峰值，类大小仍平衡</div><div class="cut-verdict"><b>K=${q.fine_k}</b>推荐细层<br>稳定性提高且没有微型类</div><div class="cut-verdict"><b>K≥${q.fragmentation_starts_at}</b>开始碎片化<br>出现少于 4 个 gene 的类</div></div><p class="note">粗层平台：${q.coarse_plateau.join(' / ')}；细层平台：${q.fine_plateau.join(' / ')}。高亮蓝色为当前粗层，绿色为当前细层。Silhouette、CH、balance、split 指标越高越好；DB 和微型类比例越低越好。</p><div class="cut-scroll"><table><thead><tr><th>K</th><th>尺度判断</th><th>Silhouette</th><th>CH</th><th>DB</th><th>Balance</th><th>类大小 min/med/max</th><th>Split Jaccard</th><th>Split ARI</th><th>小类&lt;4</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}
function visualChildren(item){if(item.kind==="root")return T.children.filter(x=>visGenes(x).length).map(x=>({key:x.id,kind:"coarse",node:x}));if(item.kind==="coarse")return item.node.children.filter(x=>visGenes(x).length).map(x=>({key:x.id,kind:"fine",node:x}));if(item.kind==="fine")return visGenes(item.node).map(id=>({key:`G${id}`,kind:"gene",node:id}));return[]}
function visualLayout(){let leaf=0;function place(item,depth,parent){const v={...item,depth,parent,children:[]};if(TREE_OPEN.has(v.key))v.children=visualChildren(v).map(x=>place(x,depth+1,v));v.x=38+depth*190;if(v.children.length)v.y=(v.children[0].y+v.children[v.children.length-1].y)/2;else v.y=28+leaf++*32;return v}const root=place({key:"ROOT",kind:"root",node:T},0,null),nodes=[],links=[];(function collect(v){nodes.push(v);for(const c of v.children){links.push([v,c]);collect(c)}})(root);return{root,nodes,links,height:Math.max(360,leaf*32+55),width:820}}
function nodeLabel(v){if(v.kind==="root")return`ROOT · ${S.n_genes}`;if(v.kind==="gene"){const g=byId(v.node);return`Gene #${v.node} · ${g.granularity_level}`}return`${v.node.id} · ${visGenes(v.node).length}/${v.node.n}`}
function nodeTitle(v){if(v.kind==="root")return"统计谱系根节点";if(v.kind==="gene"){const g=byId(v.node);return`Gene #${v.node} · ${g.statistical_role} · stability ${fmt(g.split_stability)}`}return`${v.node.id} · ${v.kind} module · stability ${fmt(v.node.stability)}`}
function drawLineageTree(){const svg=document.getElementById("lineageTree");if(!svg)return;const l=visualLayout();svg.setAttribute("viewBox",`0 0 ${l.width} ${l.height}`);svg.setAttribute("width",l.width);svg.setAttribute("height",l.height);const paths=l.links.map(([a,b])=>{const mid=(a.x+b.x)/2;return`<path class="tree-link" d="M${a.x},${a.y} C${mid},${a.y} ${mid},${b.y} ${b.x},${b.y}"/>`}).join("");const nodes=l.nodes.map(v=>{const expandable=visualChildren(v).length>0,open=TREE_OPEN.has(v.key),mark=expandable?`<line class="branch-mark" x1="-3" x2="3" y1="0" y2="0"/>${open?'':`<line class="branch-mark" x1="0" x2="0" y1="-3" y2="3"/>`}`:"";return`<g class="vnode ${v.kind}${TREE_SELECTED===v.key?' selected':''}" data-key="${v.key}" transform="translate(${v.x},${v.y})"><title>${esc(nodeTitle(v))}</title><circle r="7"></circle>${mark}<text x="13" y="0">${esc(nodeLabel(v))}</text></g>`}).join("");svg.innerHTML=paths+nodes;svg.querySelectorAll(".vnode").forEach(el=>el.addEventListener("click",()=>{const v=l.nodes.find(x=>x.key===el.dataset.key);TREE_SELECTED=v.key;if(visualChildren(v).length){if(TREE_OPEN.has(v.key))TREE_OPEN.delete(v.key);else TREE_OPEN.add(v.key)}drawLineageTree();inspectTreeNode(v,false)}))}
function treePreset(mode){TREE_OPEN.clear();if(mode!=="root")TREE_OPEN.add("ROOT");if(mode==="fine")T.children.filter(x=>visGenes(x).length).forEach(x=>TREE_OPEN.add(x.id));TREE_SELECTED="ROOT";drawLineageTree();inspectTreeNode({key:"ROOT",kind:"root",node:T,depth:0},false)}
function inspectTreeNode(v,redraw=true){if(redraw)drawLineageTree();const box=document.getElementById("treeInspector");if(!box)return;if(v.kind==="root"){box.innerHTML=`<h3>ROOT</h3><div class="inspect-path">1024 genes → 32 C → 64 F</div><p class="note">根节点包含全部 gene。粗类和细类来自融合谱空间的 Ward 层次切分。</p><div class="kpis"><div class="kpi"><b>${S.coarse_clusters}</b>C modules</div><div class="kpi"><b>${S.fine_clusters}</b>F modules</div></div>`;return}if(v.kind==="gene"){const g=byId(v.node);box.innerHTML=`<h3>Gene #${v.node}</h3><div class="inspect-path">ROOT › ${g.coarse_cluster} › ${g.fine_cluster} › Gene #${v.node}</div><p><span class="tag role">${g.statistical_role}</span> <span class="tag">${g.granularity_level}</span></p><div class="kpis"><div class="kpi"><b>${fmt(g.split_stability)}</b>stability</div><div class="kpi"><b>${g.image_support}</b>images</div></div><button id="openTreeDetail">查看完整详情</button>${card(v.node)}`;document.getElementById("openTreeDetail").onclick=()=>showGene(v.node);return}const n=v.node,fine=v.kind==="fine";box.innerHTML=`<h3>${n.id}</h3><div class="inspect-path">ROOT › ${fine?n.id.replace(/^F/,byId(n.genes[0]).coarse_cluster+' › F'):n.id}</div><p class="note">${fine?'细模块':'粗模块'} · ${visGenes(n).length}/${n.n} 个当前可见 gene</p><div class="kpis"><div class="kpi"><b>${fmt(n.stability)}</b>stability</div><div class="kpi"><b>#${n.medoid_gene}</b>medoid</div></div><button id="openTreeDetail">查看完整详情</button>${card(n.medoid_gene)}`;document.getElementById("openTreeDetail").onclick=()=>showCluster(n)}
function metric(k,v,max){return`<div class="metric"><span>${k}</span><span class="bar"><i style="width:${100*v/max}%"></i></span><b>${v}</b></div>`}
function showCluster(n){const ids=visGenes(n),fine=!n.children;detail.innerHTML=`<div class="headline"><h2>${n.id}</h2><span class="tag">${fine?'fine module':'coarse module'}</span><span class="tag good">stability ${fmt(n.stability)}</span></div><div class="kpis"><div class="kpi"><b>${ids.length}</b>当前可见 / ${n.n}</div><div class="kpi"><b>#${n.medoid_gene}</b>medoid gene</div>${fine?`<div class="kpi"><b>${Object.keys(n.granularity_distribution).join(' · ')}</b>粒度构成</div>`:''}</div><p class="note">成员按五视图融合后的谱空间归入同一 branch。Medoid 是该 branch 内融合相似度总和最高的 gene。</p><div class="cards">${ids.map(card).join("")}</div>`}
function showGene(id){const g=byId(id),examples=E.genes[String(id)]?.ex||[],rels=R.filter(x=>+x.source===id||+x.target===id);detail.innerHTML=`<div class="headline"><h2>Gene #${id}</h2><span class="tag role">${g.statistical_role}</span><span class="tag">${g.granularity_level}</span><span class="tag">${g.coarse_cluster} › ${g.fine_cluster}</span>${g.has_equivalent_relation?'<span class="tag warn">有等价候选</span>':''}</div><div class="kpis"><div class="kpi"><b>${fmt(g.split_stability)}</b>split stability</div><div class="kpi"><b>${fmt(g.nearest_fused_similarity)}</b>nearest fused</div><div class="kpi"><b>${g.image_support}</b>image support</div><div class="kpi"><b>${fmt(g.position_r2)}</b>position R²</div><div class="kpi"><b>${fmt(g.quality_r2)}</b>quality R²</div></div>
<div class="grid2"><div class="box"><h3>结构与稳定性</h3>${metric('split stability',g.split_stability,1)}${metric('nearest fused similarity',g.nearest_fused_similarity,1)}${metric('self adjacency',g.self_adjacency_rate,1)}${metric('Moran I',Math.max(0,+g.spatial_morans_i),1)}${metric('spatial entropy',g.spatial_entropy,1)}</div><div class="box"><h3>nuisance / specificity</h3>${metric('position component P',g.position_component_probability,1)}${metric('quality component P',g.quality_component_probability,1)}${metric('city-specific P',g.city_specific_probability,1)}${metric('rare P',g.rare_probability,1)}${metric('unstable P',g.unstable_probability,1)}<p class="note">quality driver: ${g.quality_driver} · prevalence: ${g.prevalence_group}</p></div></div>
<h3>关系 · ${rels.length}</h3><div class="rels">${rels.sort((a,b)=>b.score-a.score).map(x=>{const other=+x.source===id?x.target:x.source;return`<div class="rel" onclick="showGene(${other})"><b>${x.relation}</b> → #${other}<br><span class="muted">score ${fmt(x.score)} · support ${x.support}</span></div>`}).join("")||'<span class="note">无保留关系</span>'}</div><h3>原有激活证据</h3><div class="examples">${examples.map(x=>`<img loading="lazy" src="${x}">`).join("")||'<span class="note">该 gene 低于旧 prevalence 展示阈值，暂无现成 exemplar。</span>'}</div>`}
</script></body></html>
