paths:
  panorama_root: /workplace/urban_visual_gene/outputs/experiments/dinov3_multicity/rectangular_panorama_frozen_mae_n30
  source_hierarchy: /workplace/urban_visual_gene/outputs/experiments/dinov3_multicity/feature_mae_n30x12800_qc/mae/hierarchy_32_64
  cache_root: /workplace/urban_visual_gene/outputs/experiments/dinov3_multicity/graph_visual_vocabulary
  paper_data_root: /workplace/urban_visual_gene/paper/data/graph_visual_vocabulary
  paper_figure_root: /workplace/urban_visual_gene/paper/figures/graph_visual_vocabulary
  old_membership: /workplace/urban_visual_gene/paper/data/visual_vocabulary/cluster_membership.csv
  old_city_composition: /workplace/urban_visual_gene/paper/data/city_composition/city_visual_composition_fine.csv
  old_city_cooccurrence_similarity: /workplace/urban_visual_gene/paper/data/cooccurrence/city_cooccurrence_similarity.csv
  old_spatial_summary: /workplace/urban_visual_gene/paper/data/spatial/city_visual_structure_summary.csv

panorama:
  rows: 14
  columns: 56
  source_views: 4
  source_view_size: 640
  dimensions: 512
  exemplar_panoramas_per_dimension: 10

graph:
  k_neighbors: 30
  epsilon: 1.0e-12
  fusion_weights:
    encoder: 0.3333333333333333
    decoder: 0.3333333333333333
    spatial: 0.3333333333333334

leiden:
  # The preregistered 0.10--2.00 sweep was run first. It ended at K=23 with
  # community count still rising, so the plan's automatic extension applies.
  gamma_min: 0.05
  gamma_max: 3.00
  gamma_step: 0.05
  n_seeds: 20

plateau:
  min_points: 3
  thresholds: [0.90, 0.85, 0.80]
  max_k_range: 2

visual_validation:
  crops_per_dimension: 10
  max_crops_per_community: 20
  neighbour_dimensions: 5
  n_permutations: 1000
  dino_batch_size: 48

downstream:
  occurrence_top_n: 8
  minimum_pair_support_absolute: 100
  minimum_pair_support_fraction: 0.0005
  grid_sizes_m: [500, 1000, 2000]
  primary_grid_size_m: 1000
  minimum_panoramas: [5, 10, 20, 30]
  primary_minimum_panoramas: 5
  moran_permutations: 199

semantic:
  python_executable: /workplace/urban_visual_gene/.venv_qwen/bin/python3
  model_dir: /workplace/models/modelscope/models/Qwen--Qwen3-VL-2B-Instruct/snapshots/master
  max_new_tokens: 700
  image_max_side: 1600

random_seed: 42
