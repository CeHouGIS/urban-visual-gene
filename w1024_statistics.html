<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>W1024 Statistical Taxonomy</title>
<style>
:root{--bg:#070b14;--panel:#0d1626;--panel2:#121f34;--line:#20314d;--text:#dbe4f0;--muted:#8a9bb5;--cyan:#39d6ff;--green:#22e0a1;--yellow:#f6c945;--red:#ff7488;--purple:#a58bff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}
header{height:55px;display:flex;align-items:center;gap:13px;padding:0 17px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;background:#070b14ee;backdrop-filter:blur(10px)}
h1{font-size:17px;margin:0}.grow{flex:1}.muted{color:var(--muted)}.btn,button,select,input{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit}.btn{font-size:12px}.layout{display:grid;grid-template-columns:370px 1fr;min-height:calc(100vh - 55px)}
aside{padding:12px;border-right:1px solid var(--line);max-height:calc(100vh - 55px);overflow:auto;position:sticky;top:55px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}.filters input{grid-column:1/-1}.tree-head{font-size:10px;color:var(--cyan);letter-spacing:1px;margin:10px 4px 6px}.node>.row{display:flex;align-items:center;gap:7px;padding:6px;border-radius:7px;cursor:pointer;font-size:12px}.row:hover,.row.active{background:var(--panel2)}.toggle{width:13px;color:var(--muted)}.name{flex:1}.count{color:var(--muted);font-size:10px}.kids{display:none;margin-left:12px;border-left:1px solid var(--line);padding-left:5px}.kids.open{display:block}
main{padding:18px;min-width:0}.empty{padding:50px;color:var(--muted)}.headline{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.headline h2{margin:0}.tag{display:inline-block;padding:2px 8px;border-radius:12px;background:#182943;color:var(--muted);font-size:10px}.tag.good{color:var(--green)}.tag.warn{color:var(--yellow)}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0 15px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:10px;color:var(--muted)}.kpi b{display:block;font-size:16px;color:var(--cyan)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px}.card{border:1px solid var(--line);background:var(--panel);border-radius:9px;overflow:hidden;cursor:pointer}.card:hover{border-color:var(--cyan)}.card-media,.no-image{width:100%;aspect-ratio:1}.card-media img{width:100%;height:100%;object-fit:cover;display:block;background:#0a1220}.no-image{display:grid;place-items:center;padding:12px;text-align:center;background:repeating-linear-gradient(135deg,#0a1220,#0a1220 10px,#0d1727 10px,#0d1727 20px);color:var(--muted);font-size:10px}.no-image[hidden]{display:none}.card .cap{padding:6px;font-size:10px;color:var(--muted)}.card .cap b{font-size:12px;color:white}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:13px}.box h3{font-size:12px;color:var(--cyan);margin:0 0 9px}.metric{display:grid;grid-template-columns:190px 1fr 65px;gap:7px;font-size:11px;align-items:center;margin:6px 0}.bar{height:7px;background:#17263e;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan))}.rels{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px}.rel{border:1px solid var(--line);border-radius:7px;padding:7px;font-size:11px;cursor:pointer}.rel:hover{border-color:var(--cyan)}.examples{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.examples img{width:100%;border-radius:8px;aspect-ratio:1;object-fit:cover}
.note{color:var(--muted);font-size:12px;line-height:1.65;margin:8px 0 14px}.role{color:var(--green)}table{width:100%;border-collapse:collapse;font-size:11px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:6px}th{color:var(--muted)}
@media(max-width:950px){.layout{display:block}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}.grid2{grid-template-columns:1fr}}
</style></head><body>
<header><h1>BatchTopK W1024/K8 · Statistical Taxonomy</h1><span class="tag">无人工 · 无 VLM</span><span class="grow"></span><a class="btn" href="genes.html">基因浏览器</a></header>
<div class="layout"><aside>
 <div class="filters"><input id="search" placeholder="Gene / C / F 编号" oninput="buildTree()"><select id="role" onchange="buildTree()"><option value="">全部统计角色</option></select><select id="level" onchange="buildTree()"><option value="">全部粒度</option></select></div>
 <div class="tree-head">STATISTICAL HIERARCHY · 32 COARSE / 64 FINE</div><div id="tree"></div>
</aside><main id="detail"><div class="empty">正在加载统计 taxonomy……</div></main></div>
<script>
let S,T,M,R,E,ACTIVE=null;const byId=id=>M[String(id)],fmt=x=>Number(x).toFixed(3);const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
Promise.all([fetch("w1024_statistical/summary.json").then(x=>x.json()),fetch("w1024_statistical/taxonomy.json").then(x=>x.json()),fetch("w1024_statistical/gene_metrics.json").then(x=>x.json()),fetch("w1024_statistical/gene_relations.json").then(x=>x.json()),fetch("genes_batchtopk_w1024_k8/manifest.json").then(x=>x.json())]).then(x=>{[S,T,M,R,E]=x;role.innerHTML+=[...new Set(Object.values(M).map(g=>g.statistical_role))].sort().map(x=>`<option>${x}</option>`).join("");level.innerHTML+=[...new Set(Object.values(M).map(g=>g.granularity_level))].sort().map(x=>`<option>${x}</option>`).join("");buildTree();showRoot()}).catch(e=>detail.innerHTML=`<div class="empty">加载失败：${e}<br>请从 formal/site 目录启动 HTTP server。</div>`);
function allowed(id){const g=byId(id),q=search.value.trim().toUpperCase();return(!role.value||g.statistical_role===role.value)&&(!level.value||g.granularity_level===level.value)&&(!q||String(id).includes(q)||g.coarse_cluster.includes(q)||g.fine_cluster.includes(q))}
function branchGenes(b){return b.genes||b.children.flatMap(x=>x.genes)}function visGenes(b){return branchGenes(b).filter(allowed)}
function buildTree(){if(!T)return;tree.innerHTML="";T.children.filter(c=>visGenes(c).length).forEach(c=>tree.appendChild(node(c,true)))}
function node(n,coarse){const wrap=document.createElement("div");wrap.className="node";const row=document.createElement("div");row.className="row";row.innerHTML=`<span class="toggle">▶</span><span class="name">${n.id}</span><span class="count">${visGenes(n).length}/${n.n}</span>`;const kids=document.createElement("div");kids.className="kids";row.onclick=()=>{setActive(row);kids.classList.toggle("open");row.querySelector(".toggle").textContent=kids.classList.contains("open")?"▼":"▶";if(!kids.dataset.ready){kids.dataset.ready=1;(coarse?n.children.filter(x=>visGenes(x).length).map(x=>node(x,false)):visGenes(n).map(g=>geneNode(g))).forEach(x=>kids.appendChild(x))}showCluster(n)};wrap.append(row,kids);return wrap}
function geneNode(id){const w=document.createElement("div");w.className="node";const r=document.createElement("div");r.className="row";const g=byId(id);r.innerHTML=`<span class="toggle"></span><span class="name">Gene #${id}</span><span class="count">${g.granularity_level}</span>`;r.onclick=()=>{setActive(r);showGene(id)};w.append(r);return w}
function setActive(x){if(ACTIVE)ACTIVE.classList.remove("active");ACTIVE=x;x.classList.add("active")}
function rep(id){const e=E.genes[String(id)];return e?.ex?.[0]||""}function card(id){const g=byId(id),im=rep(id),media=im?`<div class="card-media"><img loading="lazy" src="${im}" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="no-image" hidden>图片加载失败</div></div>`:'<div class="no-image">暂无 exemplar<br>该 gene 未达到旧展示阈值</div>';return`<div class="card" onclick="showGene(${id})">${media}<div class="cap"><b>#${id}</b> · ${g.granularity_level}<br>${g.statistical_role}<br>${g.fine_cluster} · stability ${fmt(g.split_stability)}</div></div>`}
function showRoot(){detail.innerHTML=`<div class="headline"><h2>Statistical Root</h2><span class="tag">${S.n_genes} genes</span></div><p class="note">五视图：encoder、decoder、28×28 位置分布、12 城分布、激活上下文。层次编号只表示统计结构，不声称自然语言语义。</p><div class="kpis"><div class="kpi"><b>${S.coarse_clusters}</b>coarse modules</div><div class="kpi"><b>${S.fine_clusters}</b>fine modules</div><div class="kpi"><b>${S.granularity_levels}</b>粒度层</div><div class="kpi"><b>${S.fused_graph_components}</b>融合图连通分量</div></div><div class="grid2"><div class="box"><h3>统计角色</h3>${Object.entries(S.role_counts).map(([k,v])=>metric(k,v,S.n_genes)).join("")}</div><div class="box"><h3>经验关系</h3>${Object.entries(S.relation_counts).map(([k,v])=>metric(k,v,Math.max(...Object.values(S.relation_counts)))).join("")}</div></div>`}
function metric(k,v,max){return`<div class="metric"><span>${k}</span><span class="bar"><i style="width:${100*v/max}%"></i></span><b>${v}</b></div>`}
function showCluster(n){const ids=visGenes(n),fine=!n.children;detail.innerHTML=`<div class="headline"><h2>${n.id}</h2><span class="tag">${fine?'fine module':'coarse module'}</span><span class="tag good">stability ${fmt(n.stability)}</span></div><div class="kpis"><div class="kpi"><b>${ids.length}</b>当前可见 / ${n.n}</div><div class="kpi"><b>#${n.medoid_gene}</b>medoid gene</div>${fine?`<div class="kpi"><b>${Object.keys(n.granularity_distribution).join(' · ')}</b>粒度构成</div>`:''}</div><p class="note">成员按五视图融合后的谱空间归入同一 branch。Medoid 是该 branch 内融合相似度总和最高的 gene。</p><div class="cards">${ids.map(card).join("")}</div>`}
function showGene(id){const g=byId(id),examples=E.genes[String(id)]?.ex||[],rels=R.filter(x=>+x.source===id||+x.target===id);detail.innerHTML=`<div class="headline"><h2>Gene #${id}</h2><span class="tag role">${g.statistical_role}</span><span class="tag">${g.granularity_level}</span><span class="tag">${g.coarse_cluster} › ${g.fine_cluster}</span>${g.has_equivalent_relation?'<span class="tag warn">有等价候选</span>':''}</div><div class="kpis"><div class="kpi"><b>${fmt(g.split_stability)}</b>split stability</div><div class="kpi"><b>${fmt(g.nearest_fused_similarity)}</b>nearest fused</div><div class="kpi"><b>${g.image_support}</b>image support</div><div class="kpi"><b>${fmt(g.position_r2)}</b>position R²</div><div class="kpi"><b>${fmt(g.quality_r2)}</b>quality R²</div></div>
<div class="grid2"><div class="box"><h3>结构与稳定性</h3>${metric('split stability',g.split_stability,1)}${metric('nearest fused similarity',g.nearest_fused_similarity,1)}${metric('self adjacency',g.self_adjacency_rate,1)}${metric('Moran I',Math.max(0,+g.spatial_morans_i),1)}${metric('spatial entropy',g.spatial_entropy,1)}</div><div class="box"><h3>nuisance / specificity</h3>${metric('position component P',g.position_component_probability,1)}${metric('quality component P',g.quality_component_probability,1)}${metric('city-specific P',g.city_specific_probability,1)}${metric('rare P',g.rare_probability,1)}${metric('unstable P',g.unstable_probability,1)}<p class="note">quality driver: ${g.quality_driver} · prevalence: ${g.prevalence_group}</p></div></div>
<h3>关系 · ${rels.length}</h3><div class="rels">${rels.sort((a,b)=>b.score-a.score).map(x=>{const other=+x.source===id?x.target:x.source;return`<div class="rel" onclick="showGene(${other})"><b>${x.relation}</b> → #${other}<br><span class="muted">score ${fmt(x.score)} · support ${x.support}</span></div>`}).join("")||'<span class="note">无保留关系</span>'}</div><h3>原有激活证据</h3><div class="examples">${examples.map(x=>`<img loading="lazy" src="${x}">`).join("")||'<span class="note">该 gene 低于旧 prevalence 展示阈值，暂无现成 exemplar。</span>'}</div>`}
</script></body></html>
