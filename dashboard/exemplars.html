<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Visual Gene · 街景类型图库</title>
<style>
:root{--bg:#070b14;--panel:#0f1828;--panel2:#121e33;--border:#1e2d47;
  --text:#dbe4f0;--muted:#8a9bb5;--accent:#39d6ff;--accent2:#7c5cff;--accent3:#22e0a1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;overflow:hidden}
#top{position:absolute;top:0;left:0;right:0;height:52px;z-index:30;display:flex;align-items:center;gap:16px;
  padding:0 18px;background:rgba(7,11,20,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.brand{font-weight:700;display:flex;align-items:center;gap:9px;font-size:15px;white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--accent),var(--accent2),var(--accent3),var(--accent));box-shadow:0 0 12px var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font-size:13px;color:var(--muted);padding:6px 11px;border-radius:8px;border:1px solid transparent;text-decoration:none}
.tab.active{color:var(--accent);border-color:var(--border);background:var(--panel2)}
.tab:hover{color:var(--text)}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{background:transparent;color:var(--muted);border:0;padding:6px 13px;cursor:pointer;font-size:13px}
.seg button.active{background:var(--accent);color:#04121a;font-weight:700}
#wrap{position:absolute;top:52px;left:0;right:0;bottom:0;display:flex}
#side{width:120px;border-right:1px solid var(--border);overflow-y:auto;padding:8px 6px;flex-shrink:0}
#side .bchip{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--muted)}
#side .bchip:hover{background:var(--panel2)}
#side .bchip.active{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
#side .sw{width:12px;height:12px;border-radius:3px;flex-shrink:0}
#side .ct{margin-left:auto;font-size:10px;color:#5f7596}
#main{flex:1;overflow-y:auto;padding:14px}
#hd{font-size:14px;color:#eaf2ff;margin:2px 4px 12px}
#hd small{color:var(--muted);font-weight:400}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cell{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:9px;overflow:hidden;cursor:zoom-in}
.cell img{width:100%;height:120px;object-fit:cover;display:block;background:#0b1322}
.cell .a{position:absolute;top:4px;left:4px;font-size:10px;color:#fff;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:5px}
.cell .id{position:absolute;bottom:0;left:0;right:0;font-size:9px;color:#cfe0f5;background:rgba(7,11,20,.7);padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lb{position:fixed;inset:0;background:rgba(3,6,12,.95);z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;cursor:zoom-out}
#lb .g{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:92vw;max-height:88vh}
#lb .g div{position:relative}
#lb .g img{max-width:45vw;max-height:42vh;border-radius:8px;background:#0b1322}
#lb .deg{position:absolute;top:6px;left:8px;font-size:12px;color:#fff;background:rgba(0,0,0,.6);padding:1px 8px;border-radius:5px}
#lb .cap{color:var(--muted);font-size:13px}
#note{position:absolute;inset:52px 0 0 0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:14px;padding:30px;display:none}
</style>
</head>
<body>
<div id="top">
  <div class="brand"><span class="dot"></span>Urban Visual Gene</div>
  <div class="tabs">
    <a class="tab" href="index.html">街道景观地图</a>
    <a class="tab" href="feature.html">特征空间</a>
    <a class="tab" href="analysis.html">分析·32基</a>
    <a class="tab" href="analysis_k128.html">分析·128基</a>
    <a class="tab" href="sankey.html">32→128 映射</a>
    <a class="tab active" href="exemplars.html">街景类型</a>
  </div>
  <div class="spacer"></div>
  <div class="seg" id="vocabseg">
    <button data-v="32" class="active">32 基</button>
    <button data-v="128">128 基</button>
  </div>
  <div class="seg" id="cityseg">
    <button data-c="HongKong" class="active">香港</button>
    <button data-c="Singapore">新加坡</button>
    <button data-c="Amsterdam">阿姆斯特丹</button>
    <button data-c="CapeTown">开普敦</button>
  </div>
</div>
<div id="wrap">
  <div id="side"></div>
  <div id="main">
    <div id="hd"></div>
    <div id="grid"></div>
  </div>
</div>
<div id="note"></div>
<div id="lb"><div class="cap"></div><div class="g"></div></div>
<script>
const IMGB=(new URLSearchParams(location.search).get('img')||window.IMG_BASE||'').replace(/\/$/,'');
const CITY_IMGDIR={HongKong:"China/HongKong",Singapore:"Singapore/Singapore",Amsterdam:"Netherlands/Amsterdam",CapeTown:"SouthAfrica/CapeTown"};
const CITYNAMES={HongKong:"香港",Singapore:"新加坡",Amsterdam:"阿姆斯特丹",CapeTown:"开普敦"};
function hsl2rgb(h,s,l){const f=n=>{const k=(n+h*12)%12;const a=s*Math.min(l,1-l);
  return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))));};return`rgb(${f(0)},${f(8)},${f(4)})`;}
function pal(v,k){return v==="32"?hsl2rgb((k*360/32)/360,0.62,0.58):hsl2rgb(((k*137.508)%360)/360,0.66,k%2?0.50:0.64);}
function imgURL(city,id,h){const d=CITY_IMGDIR[city];
  return `${IMGB}/data/SVIs/GSV/images/${d}/${id[0].toLowerCase()}/${id[1].toLowerCase()}/${id[2].toLowerCase()}/${id}_${h}.jpg`;}
let DATA=null, CITY="HongKong", VOCAB="32", BASIS=null;

function renderSide(){
  const m=DATA[CITY][VOCAB]; const ks=Object.keys(m).map(Number).sort((a,b)=>a-b);
  if(BASIS===null||!(BASIS in m)) BASIS=ks[0];
  document.getElementById('side').innerHTML=ks.map(k=>
    `<div class="bchip ${k==BASIS?'active':''}" onclick="pick(${k})">
       <span class="sw" style="background:${pal(VOCAB,k)}"></span>#${k}<span class="ct">${m[k].length}</span></div>`).join('');
}
function renderGrid(){
  const items=DATA[CITY][VOCAB][BASIS]||[];
  document.getElementById('hd').innerHTML=`${CITYNAMES[CITY]} · ${VOCAB} 基 · <b style="color:${pal(VOCAB,BASIS)}">基 #${BASIS}</b> 的典型街景 <small>(激活最强的 ${items.length} 个点;点图看四方向)</small>`;
  if(!IMGB){document.getElementById('grid').innerHTML='';document.getElementById('note').style.display='flex';
    document.getElementById('note').innerHTML='图片后端未配置——请通过 SSH 隧道 + serve.py 打开,<br>并在网址加 <code>?img=http://localhost:8788</code> 才能显示街景图。';return;}
  document.getElementById('note').style.display='none';
  document.getElementById('grid').innerHTML=items.map(it=>
    `<div class="cell" onclick='openLB(${JSON.stringify(it.id)})'>
       <img loading="lazy" src="${imgURL(CITY,it.id,0)}" onerror="this.style.opacity=.12">
       <span class="a">a=${it.a}</span><span class="id">${it.id}</span></div>`).join('');
}
function pick(k){BASIS=k;renderSide();renderGrid();document.getElementById('main').scrollTop=0;}
function openLB(id){const lb=document.getElementById('lb');
  lb.querySelector('.cap').textContent=`${CITYNAMES[CITY]} · ${id} · 四方向`;
  lb.querySelector('.g').innerHTML=[0,90,180,270].map(h=>
    `<div><span class="deg">${h}°</span><img src="${imgURL(CITY,id,h)}" onerror="this.style.opacity=.12"></div>`).join('');
  lb.style.display='flex';}
document.getElementById('lb').onclick=()=>document.getElementById('lb').style.display='none';
document.getElementById('vocabseg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#vocabseg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  VOCAB=b.dataset.v;BASIS=null;renderSide();renderGrid();});
document.getElementById('cityseg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#cityseg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  CITY=b.dataset.c;BASIS=null;renderSide();renderGrid();});
fetch('data/basis_exemplars.json?v=1').then(r=>r.json()).then(d=>{DATA=d;renderSide();renderGrid();})
  .catch(e=>{document.getElementById('note').style.display='flex';document.getElementById('note').textContent='加载失败: '+e;});
</script>
</body>
</html>
