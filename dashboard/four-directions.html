<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="10个代表地区的同一全景点四方向Feature-MAE视觉组成、热力图与图结构交互浏览器">
<title>Urban Visual Gene · 四方向视觉构图</title>
<style>
:root{--bg:#070b14;--panel:#0d1524;--panel2:#121e33;--border:#20304a;--text:#dce7f5;--muted:#8fa1bb;--cyan:#39d6ff;--violet:#8a72ff;--green:#26dfa5;--amber:#ffc857;--red:#ff7185}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 85% -10%,#182e52 0,transparent 34rem),var(--bg);color:var(--text);font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}button,input{font:inherit}a{color:inherit}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;min-height:54px;padding:8px 18px;background:rgba(7,11,20,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;white-space:nowrap}.brand i{width:10px;height:10px;border-radius:50%;background:conic-gradient(var(--cyan),var(--violet),var(--green),var(--cyan));box-shadow:0 0 14px var(--cyan)}
.tabs{display:flex;gap:5px;flex-wrap:wrap}.tab{padding:6px 11px;color:var(--muted);font-size:12px;text-decoration:none;border:1px solid transparent;border-radius:8px}.tab:hover{color:var(--text)}.tab.active{color:var(--cyan);border-color:var(--border);background:var(--panel2)}
.shell{width:min(1540px,100%);margin:auto;padding:30px 20px 70px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:800}.hero h1{margin:7px 0 8px;font-size:clamp(28px,4vw,48px);letter-spacing:-.035em}.hero h1 span{background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}.lead{max-width:820px;color:var(--muted);font-size:14px;line-height:1.75;margin:0}.kpis{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.kpi{min-width:92px;padding:10px 13px;background:var(--panel);border:1px solid var(--border);border-radius:11px;text-align:center}.kpi b{display:block;color:var(--cyan);font-size:20px}.kpi span{font-size:10px;color:var(--muted)}
.workspace{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px}.panel{background:rgba(13,21,36,.94);border:1px solid var(--border);border-radius:14px}.sidebar{padding:12px;align-self:start;position:sticky;top:68px}.side-title{padding:6px 7px 10px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.11em}.area-btn{width:100%;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:8px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--text);padding:9px 8px;margin:2px 0;text-align:left;cursor:pointer}.area-btn:hover{background:var(--panel2)}.area-btn.active{border-color:#31516f;background:linear-gradient(100deg,rgba(57,214,255,.13),rgba(138,114,255,.08))}.aid{color:var(--cyan);font-size:11px;font-weight:850}.acity{font-size:12px;font-weight:700}.asource{color:var(--muted);font-size:10px}.chev{color:var(--muted)}
.content{min-width:0;display:grid;gap:14px}.location-head{padding:15px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}.location-head h2{font-size:21px;margin:0}.location-head .sub{font-size:11px;color:var(--muted);margin-top:3px}.badges{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}.badge{padding:5px 9px;border:1px solid var(--border);border-radius:20px;font-size:10px;color:var(--muted)}.badge b{color:var(--green)}
.card-head{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}.card-head h3{margin:0;font-size:13px}.card-head p{margin:0;color:var(--muted);font-size:10.5px}.card-head .tools{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:10px}.card-head input{accent-color:var(--cyan);width:120px}
.viewer{position:relative;overflow:hidden;background:#03060b;border-radius:0 0 13px 13px}.viewer img{display:block;width:100%;height:auto}.viewer .activation{position:absolute;inset:0;transition:opacity .1s}.headings{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);pointer-events:none}.headings span{align-self:start;justify-self:start;margin:8px;padding:4px 8px;border-radius:7px;background:rgba(4,8,15,.76);font-size:10px;font-weight:750}.headings span+span{border-left:1px solid rgba(255,255,255,.28)}
.analysis-grid{display:grid;grid-template-columns:minmax(360px,.95fr) minmax(460px,1.25fr);gap:14px}.visual-body{position:relative;padding:14px;min-height:420px}.heatwrap{height:370px;display:grid;place-items:center}.heatwrap canvas{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:crosshair}.compass{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.dir{padding:9px;border:1px solid var(--border);border-radius:9px;background:var(--panel2);text-align:center}.dir b{display:block;font-size:13px;color:#fff}.dir span{display:block;margin-top:3px;color:var(--muted);font-size:10px}.graphbox{height:420px;position:relative}.graphbox svg{width:100%;height:100%;display:block}.edge{stroke:#65778b;stroke-opacity:.46;stroke-linecap:round}.node{cursor:pointer;transition:.13s}.node:hover{stroke:#fff;stroke-width:2}.node-label{font-size:8px;fill:#07101a;pointer-events:none;font-weight:850;text-anchor:middle;dominant-baseline:central}.highlight-ring{fill:none;stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 5px var(--cyan))}
.featureline{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--border);min-height:43px;font-size:11px;color:var(--muted)}.featureline b{color:var(--cyan)}.featureline .clear{margin-left:auto;border:1px solid var(--border);background:var(--panel2);color:var(--muted);border-radius:7px;padding:4px 8px;cursor:pointer}
.tip{position:fixed;z-index:80;display:none;pointer-events:none;padding:7px 9px;border:1px solid #355071;border-radius:8px;background:rgba(5,10,18,.94);box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:11px;line-height:1.45;color:#fff}.tip b{color:var(--cyan)}
.footnote{padding:13px 16px;color:var(--muted);font-size:11px;line-height:1.7}.footnote a{color:var(--cyan);text-decoration:none}.loading{padding:70px;text-align:center;color:var(--muted)}
@media(max-width:1050px){.hero{display:block}.kpis{justify-content:flex-start;margin-top:16px}.workspace{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;gap:5px}.side-title{display:none}.area-btn{min-width:155px}.analysis-grid{grid-template-columns:1fr}.graphbox{height:460px}}
@media(max-width:650px){.top{align-items:flex-start;flex-direction:column;gap:8px}.shell{padding:22px 10px 45px}.location-head{align-items:flex-start}.badges{margin-left:0}.analysis-grid{display:block}.analysis-grid .panel{margin-top:12px}.heatwrap{height:280px}.graphbox{height:380px}.card-head{align-items:flex-start;flex-wrap:wrap}.card-head .tools{margin-left:0;width:100%}}
</style>
</head>
<body>
<header class="top"><div class="brand"><i></i>Urban Visual Gene</div><nav class="tabs"><a class="tab" href="index.html">街道景观地图</a><a class="tab" href="feature.html">特征空间</a><a class="tab" href="analysis.html">分析</a><a class="tab active" href="four-directions.html">四方向视觉构图</a></nav></header>
<main class="shell">
  <section class="hero"><div><div class="eyebrow">Location-level graph archetypes · 2026-09-26</div><h1>同一地点的<span>四方向视觉构图</span></h1><p class="lead">每一行对应同一个 panorama：将北、东、南、西四张街景拼成连续画布，将四张 14×14 F map 拼成 14×56 heatmap，并对四向 node area 与 adjacency weight 求均值得到地点级 graph。</p></div><div class="kpis" id="kpis"></div></section>
  <section class="workspace">
    <aside class="panel sidebar" id="areaList"><div class="side-title">选择代表地区</div></aside>
    <div class="content" id="content"><div class="panel loading">正在载入四方向结果…</div></div>
  </section>
</main>
<div class="tip" id="tip"></div>
<script>
const $=id=>document.getElementById(id);let DATA=null,current=0,selectedF=null,opacity=.43,edgeLimit=28,nodeLimit=16;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
fetch("multi_area/data.json").then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{DATA=d;init()}).catch(e=>{$("content").innerHTML=`<div class="panel loading">载入失败：${esc(e.message)}</div>`});
function init(){const e=DATA.experiment;$('kpis').innerHTML=[[e.areas,'代表地区'],[e.cities,'城市'],[e.direction_images,'方向图'],['14×56','拼接热图']].map(x=>`<div class="kpi"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');$('areaList').innerHTML='<div class="side-title">选择代表地区</div>'+DATA.areas.map((a,i)=>`<button class="area-btn ${i===0?'active':''}" data-i="${i}"><span class="aid">${a.id}</span><span><span class="acity">${esc(a.city)}</span><span class="asource">source ${a.source_archetype}</span></span><span class="chev">›</span></button>`).join('');$('areaList').onclick=e=>{const b=e.target.closest('.area-btn');if(!b)return;current=Number(b.dataset.i);selectedF=null;document.querySelectorAll('.area-btn').forEach(x=>x.classList.toggle('active',x===b));render()};render()}
function render(){const a=DATA.areas[current];$('content').innerHTML=`<section class="panel location-head"><div><h2>${a.id} · ${esc(a.city)}</h2><div class="sub">${esc(a.panorama_id)} · ${a.coordinates[0].toFixed(6)}, ${a.coordinates[1].toFixed(6)}</div></div><div class="badges"><span class="badge">source <b>${a.source_archetype}</b></span><span class="badge">缓存 <b>${a.cached_directions}</b> 向</span><span class="badge">补齐 <b>${a.completed_directions}</b> 向</span><span class="badge">mean contacts <b>${a.mean_cross_contacts}</b></span></div></section>
<section class="panel"><div class="card-head"><div><h3>同一位置四方向拼接</h3><p>0° North · 90° East · 180° South · 270° West</p></div><div class="tools"><span>激活叠加</span><input id="opacity" type="range" min="0" max="100" value="${Math.round(opacity*100)}"><b id="opacityValue">${Math.round(opacity*100)}%</b></div></div><div class="viewer"><img src="${a.original_image}" alt="${esc(a.city)} 四方向原图拼接"><img class="activation" id="activation" style="opacity:${opacity}" src="${a.activation_image}" alt="Feature-MAE激活叠加"><div class="headings"><span>0° · N</span><span>90° · E</span><span>180° · S</span><span>270° · W</span></div></div></section>
<section class="analysis-grid"><article class="panel"><div class="card-head"><div><h3>14×56 stitched F heatmap</h3><p>点击 cell 可同步高亮 graph 中的 F node</p></div></div><div class="visual-body"><div class="heatwrap"><canvas id="heat"></canvas></div><div class="compass">${a.directions.map(d=>`<div class="dir"><b>${d.heading}° · ${d.archetype}</b><span>${d.name} · distance ${d.distance.toFixed(3)}</span></div>`).join('')}</div></div><div class="featureline" id="heatStatus">悬停查看 patch；点击选择 F 类别。</div></article>
<article class="panel"><div class="card-head"><div><h3>Four-view mean graph</h3><p>四向 node area 与 adjacency weight 的均值</p></div><div class="tools"><span>nodes</span><input id="nodes" type="range" min="8" max="30" value="${nodeLimit}"><b id="nodeValue">${nodeLimit}</b><span>edges</span><input id="edges" type="range" min="12" max="50" value="${edgeLimit}"><b id="edgeValue">${edgeLimit}</b></div></div><div class="graphbox" id="graph"></div><div class="featureline" id="graphStatus">点击节点与 heatmap 联动。<button class="clear" id="clear">清除选择</button></div></article></section>
<div class="panel footnote">地点级 graph 使用四个方向 graph descriptor 的算术均值，因此 node area 仍合计为 1；edge 表示每个方向平均共享边界强度。<a href="../paper/data/image_graph_compact_archetypes/multi_area_four_directions/multi_area_summary.csv">下载地点汇总 CSV</a></div>`;
  $('opacity').oninput=e=>{opacity=Number(e.target.value)/100;$('activation').style.opacity=opacity;$('opacityValue').textContent=e.target.value+'%'};$('nodes').oninput=e=>{nodeLimit=Number(e.target.value);$('nodeValue').textContent=nodeLimit;drawGraph()};$('edges').oninput=e=>{edgeLimit=Number(e.target.value);$('edgeValue').textContent=edgeLimit;drawGraph()};$('clear').onclick=()=>{selectedF=null;drawHeat();drawGraph();updateStatus()};drawHeat();drawGraph();window.onresize=()=>{drawHeat();drawGraph()}}
function drawHeat(){const a=DATA.areas[current],c=$('heat'),box=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=Math.max(1,Math.round(box.width*dpr));c.height=Math.max(1,Math.round(box.height*dpr));const x=c.getContext('2d'),cw=c.width/56,ch=c.height/14;x.clearRect(0,0,c.width,c.height);for(let y=0;y<14;y++)for(let col=0;col<56;col++){const f=a.heatmap[y*56+col],n=a.nodes[f];x.fillStyle=n.color;x.fillRect(col*cw,y*ch,Math.ceil(cw+.2),Math.ceil(ch+.2));if(selectedF===f){x.strokeStyle='#fff';x.lineWidth=Math.max(1,1.4*dpr);x.strokeRect(col*cw+.8,y*ch+.8,cw-1.6,ch-1.6)}}for(const b of [14,28,42]){x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=1.4*dpr;x.beginPath();x.moveTo(b*cw,0);x.lineTo(b*cw,c.height);x.stroke()}c.onmousemove=e=>heatHover(e,c,a);c.onmouseleave=hideTip;c.onclick=e=>{const p=heatCell(e,c);selectedF=a.heatmap[p.y*56+p.x];drawHeat();drawGraph();updateStatus()}}
function heatCell(e,c){const r=c.getBoundingClientRect();return{x:Math.max(0,Math.min(55,Math.floor((e.clientX-r.left)/r.width*56))),y:Math.max(0,Math.min(13,Math.floor((e.clientY-r.top)/r.height*14)))}}
function heatHover(e,c,a){const p=heatCell(e,c),f=a.heatmap[p.y*56+p.x],dir=Math.floor(p.x/14),localX=p.x%14;showTip(e,`<b>F${String(f).padStart(3,'0')}</b><br>${a.directions[dir].heading}° ${a.directions[dir].name}<br>patch row ${p.y+1}, col ${localX+1}`)}
function drawGraph(){const a=DATA.areas[current],host=$('graph'),W=720,H=430;const topNodes=[...a.nodes].sort((x,y)=>y.area-x.area).slice(0,nodeLimit);const topEdges=[...a.edges].sort((x,y)=>y.weight-x.weight).slice(0,edgeLimit);const ids=new Set(topNodes.map(n=>n.id));topEdges.forEach(e=>{ids.add(e.source);ids.add(e.target)});if(selectedF!==null)ids.add(selectedF);const nodes=a.nodes.filter(n=>ids.has(n.id));const pos=n=>[W/2+n.position[0]*235,H/2-n.position[1]*185];const maxArea=Math.max(...a.nodes.map(n=>n.area)),maxEdge=Math.max(...a.edges.map(e=>e.weight));let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(a.city)} aggregated graph">`;for(const e of topEdges){const s=a.nodes[e.source],t=a.nodes[e.target],[x1,y1]=pos(s),[x2,y2]=pos(t);svg+=`<line class="edge" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${.7+5*e.weight/maxEdge}" data-edge="${e.source},${e.target},${e.mean_contacts}"></line>`}for(const n of nodes){const [x,y]=pos(n),r=5+19*Math.sqrt(n.area/maxArea);if(selectedF===n.id)svg+=`<circle class="highlight-ring" cx="${x}" cy="${y}" r="${r+5}"></circle>`;svg+=`<g class="node" data-node="${n.id}"><circle cx="${x}" cy="${y}" r="${r}" fill="${n.color}" stroke="rgba(255,255,255,.75)" stroke-width="1"></circle><text class="node-label" x="${x}" y="${y}">F${String(n.id).padStart(3,'0')}</text></g>`}svg+='</svg>';host.innerHTML=svg;host.querySelectorAll('.node').forEach(g=>{g.onmousemove=e=>{const n=a.nodes[Number(g.dataset.node)];showTip(e,`<b>${n.label}</b><br>mean area ${(n.area*100).toFixed(1)}%`)};g.onmouseleave=hideTip;g.onclick=()=>{selectedF=Number(g.dataset.node);drawHeat();drawGraph();updateStatus()}});host.querySelectorAll('.edge').forEach(l=>{l.onmousemove=e=>{const [s,t,c]=l.dataset.edge.split(',');showTip(e,`<b>F${String(s).padStart(3,'0')} – F${String(t).padStart(3,'0')}</b><br>mean contacts ${Number(c).toFixed(2)}`)};l.onmouseleave=hideTip})}
function updateStatus(){const a=DATA.areas[current];if(selectedF===null){$('heatStatus').textContent='悬停查看 patch；点击选择 F 类别。';$('graphStatus').innerHTML='点击节点与 heatmap 联动。<button class="clear" id="clear">清除选择</button>'}else{const n=a.nodes[selectedF],count=a.heatmap.filter(x=>x===selectedF).length;$('heatStatus').innerHTML=`已选择 <b>${n.label}</b> · ${count}/784 patches · 四向平均面积 ${(n.area*100).toFixed(1)}%`;$('graphStatus').innerHTML=`同步高亮 <b>${n.label}</b><button class="clear" id="clear">清除选择</button>`}$('clear').onclick=()=>{selectedF=null;drawHeat();drawGraph();updateStatus()}}
function showTip(e,html){const t=$('tip');t.innerHTML=html;t.style.display='block';const x=Math.min(innerWidth-190,e.clientX+14),y=Math.min(innerHeight-80,e.clientY+14);t.style.left=x+'px';t.style.top=y+'px'}function hideTip(){$('tip').style.display='none'}
document.addEventListener('keydown',e=>{if(!DATA)return;if(e.key==='ArrowDown'||e.key==='ArrowRight'){current=(current+1)%DATA.areas.length}else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){current=(current-1+DATA.areas.length)%DATA.areas.length}else return;selectedF=null;document.querySelectorAll('.area-btn').forEach((x,i)=>x.classList.toggle('active',i===current));render()});
</script>
</body>
</html>
