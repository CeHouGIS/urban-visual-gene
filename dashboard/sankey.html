<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Visual Gene · 32→128 基映射</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{--bg:#070b14;--panel:#0f1828;--panel2:#121e33;--border:#1e2d47;
  --text:#dbe4f0;--muted:#8a9bb5;--accent:#39d6ff;--accent2:#7c5cff;--accent3:#22e0a1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(800px 500px at 10% -5%,rgba(124,92,255,.14),transparent 60%),
    radial-gradient(700px 500px at 95% 5%,rgba(57,214,255,.12),transparent 55%)}
#top{position:absolute;top:0;left:0;right:0;height:52px;z-index:30;display:flex;align-items:center;
  gap:18px;padding:0 18px;background:rgba(7,11,20,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.brand{font-weight:700;display:flex;align-items:center;gap:9px;font-size:15px;white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--accent),var(--accent2),var(--accent3),var(--accent));box-shadow:0 0 12px var(--accent)}
.tabs{display:flex;gap:6px;margin-left:8px;flex-wrap:wrap}
.tab{font-size:13px;color:var(--muted);padding:6px 12px;border-radius:8px;border:1px solid transparent;text-decoration:none}
.tab.active{color:var(--accent);border-color:var(--border);background:var(--panel2)}
.tab:hover{color:var(--text)}
#hd{position:absolute;top:60px;left:18px;right:18px;z-index:5}
#hd h2{margin:0;font-size:16px;color:#eaf2ff}
#hd p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5;max-width:900px}
#chart{position:absolute;top:118px;left:8px;width:calc(50% - 12px);bottom:8px}
#matrix{position:absolute;top:118px;left:50%;right:8px;bottom:8px}
.ptag{position:absolute;top:122px;z-index:6;font-size:11px;letter-spacing:.5px;color:var(--accent);
  background:rgba(7,11,20,.7);border:1px solid var(--border);padding:3px 9px;border-radius:7px}
#loading{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="top">
  <div class="brand"><span class="dot"></span>Urban Visual Gene</div>
  <div class="tabs">
    <a class="tab" href="index.html">街道景观地图</a>
    <a class="tab" href="feature.html">特征空间</a>
    <a class="tab" href="analysis.html">分析·32基</a>
    <a class="tab" href="analysis_k128.html">分析·128基</a>
    <a class="tab active" href="sankey.html">32→128 映射</a>
  </div>
</div>
<div id="hd">
  <h2>视觉基映射:32 基 → 128 基 <span style="font-weight:400;color:var(--muted);font-size:13px">· 四城合并</span></h2>
  <p id="sub">每个节点取其在 32 基 / 128 基 SAE 下的主导基,统计两者的对应流量。左=32 基,右=128 基;一条粗带 = 多少路网节点由某个 32 基主导、细分到某个 128 基主导。只画占该 32 基 ≥2% 的主要分支。</p>
</div>
<div class="ptag" style="left:14px">桑基流</div>
<div class="ptag" style="left:calc(50% + 6px)">转移矩阵 P(128基 | 32基)</div>
<div id="chart"></div>
<div id="matrix"></div>
<div id="loading"><div class="spin"></div></div>
<script>
async function main(){
  const S=await fetch('data/sankey_32_128.json?v=1').then(r=>r.json());
  document.getElementById('loading').style.display='none';
  const ch=echarts.init(document.getElementById('chart'),null,{renderer:'canvas'});
  const labelOf={}; S.nodes.forEach(n=>labelOf[n.name]=n.label);
  ch.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'item',triggerOn:'mousemove',backgroundColor:'rgba(13,21,36,.96)',
      borderColor:'#1e2d47',textStyle:{color:'#dbe4f0'},
      formatter:p=>p.dataType==='edge'
        ? `${labelOf[p.data.source]} → ${labelOf[p.data.target]}<br><b>${p.data.value.toLocaleString()}</b> 节点`
        : `${p.data.label}`},
    series:[{
      type:'sankey', left:24, right:90, top:8, bottom:8,
      data:S.nodes, links:S.links,
      nodeWidth:16, nodeGap:7, draggable:true,
      emphasis:{focus:'adjacency'},
      label:{color:'#dbe4f0',fontSize:11,formatter:p=>p.data.label},
      lineStyle:{color:'gradient',opacity:0.45,curveness:0.5}
    }]
  });
  document.getElementById('sub').innerHTML+=` <span style="color:var(--accent3)">共 ${S.total.toLocaleString()} 个路网节点 · `+
    `${S.n_left} 个 32 基 → ${S.n_right} 个 128 基 · ${S.n_links} 条主要分支</span>`;
  // ---- right: 32->128 transition matrix (row-normalised P(128|32)) ----
  const u32=S.used32, u128=S.used128;
  const rowIdx={}; u32.forEach((k,i)=>rowIdx[k]=i);
  const colIdx={}; u128.forEach((j,i)=>colIdx[j]=i);
  const data=[]; let mx=0.001;
  for(const k of u32){ const rs=S.rowsum[k]||1;
    for(const j of u128){ const c=S.matrix[k][j]; if(c>0){ const p=c/rs; data.push([colIdx[j],rowIdx[k],p,c]); if(p>mx)mx=p; } } }
  const mch=echarts.init(document.getElementById('matrix'),null,{renderer:'canvas'});
  mch.setOption({
    backgroundColor:'transparent', grid:{left:42,right:14,top:10,bottom:54},
    tooltip:{backgroundColor:'rgba(13,21,36,.96)',borderColor:'#1e2d47',textStyle:{color:'#dbe4f0'},
      formatter:p=>`32#${u32[p.value[1]]} → 128#${u128[p.value[0]]}<br>P=${(p.value[2]*100).toFixed(1)}% · ${p.value[3].toLocaleString()} 节点`},
    xAxis:{type:'category',data:u128.map(j=>'#'+j),name:'128 基',nameLocation:'middle',nameGap:34,
      nameTextStyle:{color:'#8a9bb5'},axisLabel:{color:'#8a9bb5',interval:2,fontSize:9,rotate:90},
      axisLine:{lineStyle:{color:'#1e2d47'}},splitArea:{show:false}},
    yAxis:{type:'category',data:u32.map(k=>'#'+k),name:'32 基',nameTextStyle:{color:'#8a9bb5'},
      axisLabel:{color:'#8a9bb5',fontSize:9},axisLine:{lineStyle:{color:'#1e2d47'}}},
    visualMap:{min:0,max:mx,calculable:true,orient:'horizontal',left:'center',bottom:2,
      itemWidth:12,itemHeight:90,inRange:{color:['#0b1d33','#39d6ff','#fde725']},textStyle:{color:'#8a9bb5'}},
    series:[{type:'heatmap',data,progressive:4000,emphasis:{itemStyle:{borderColor:'#fff',borderWidth:1}}}]
  });
  window.addEventListener('resize',()=>{ch.resize();mch.resize();});
}
main().catch(e=>{document.getElementById('loading').innerHTML=
  '<div style="color:#ff8a8a;padding:24px;max-width:600px;font-size:13px">Sankey 加载失败:'+String(e).replace(/</g,'&lt;')+'</div>';});
</script>
</body>
</html>
