experiment:
  name: dinov3_patch_batchtopk_w1024_k8
  seed: 42
  output_dir: ${FORMAL_OUT}

backbone:
  name: dinov3
  model_name: facebook/dinov3-vitl16-pretrain-lvd1689m
  checkpoint_path: ""
  freeze: true
  input_size: 448
  patch_size: 16
  feature_layer: -2
  token_type: patch
  remove_prefix_tokens: true
  use_register_tokens: false

feature_cache:
  enabled: true
  source: ${FORMAL_OUT}/dict_sample_allpatches.f16.npy
  storage_dtype: float16
  patches_per_view: 784

data:
  center: false
  l2_normalize: true

model:
  type: batch_topk
  input_dim: auto
  latent_dim: 1024
  k: 8
  tied_weights: false
  decoder_unit_norm: true

training:
  batch_size: 16384
  epochs: 60
  learning_rate: 0.001
  weight_decay: 0.0
  optimizer: adam
  reconstruction_loss: cosine
  block_rows: 262144
