<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Urban Visual Gene · Interactive Seed UMAP</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>
body{margin:0;background:#070b14;color:#dbe4f0;font:14px Inter,Segoe UI,sans-serif}header,.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px}header{border-bottom:1px solid #20314d}header b{flex:1}a,button,input,select,label{color:#dbe4f0;background:#121f34;border:1px solid #20314d;border-radius:8px;padding:7px 10px;text-decoration:none}.tools span{color:#8a9bb5}#plot{height:calc(100vh - 120px);min-height:520px}.seed{display:inline-flex;gap:4px}.error{color:#ff7488}
</style></head><body><header><b>Urban Visual Gene · Interactive Seed UMAP</b><a href="seed_stability.html">← Seed Stability</a></header><div class="tools"><select id="mode"><option value="all">All genes</option><option value="stable">Stable only</option><option value="unmatched">Unmatched only</option></select><input id="query" placeholder="stable_0122 or 0122"><button id="go">Highlight family</button><button id="reset">Clear</button><span id="checks"></span><span id="status">Loading…</span></div><div id="plot"></div><script>
const C={11:'#39d6ff',23:'#a58bff',37:'#22e0a1',53:'#f6c945',71:'#ff7488'},active=new Set(Object.keys(C));let rows=[],hi='',wired=false;
function family(v){v=v.trim();if(!v)return'';const m=v.match(/(?:stable[_-]?)?(\d+)/i);return m?'stable_'+m[1].padStart(4,'0'):v}function parse(t){const a=t.trim().split(/\r?\n/);a.shift();return a.map(x=>{const v=x.split(',');return{s:+v[0],g:+v[1],x:+v[2],y:+v[3],ok:v[4]==='1',f:v[5]}})}
Object.keys(C).forEach(s=>{const l=document.createElement('label');l.className='seed';l.innerHTML=`<input type="checkbox" checked> <i style="color:${C[s]}">Seed ${s}</i>`;l.firstChild.onchange=e=>{e.target.checked?active.add(s):active.delete(s);draw()};checks.append(l)});
function draw(){const filtered=rows.filter(r=>active.has(String(r.s))&&(mode.value==='all'||mode.value==='stable'&&r.ok||mode.value==='unmatched'&&!r.ok));const traces=Object.keys(C).filter(s=>active.has(s)).map(s=>{const d=filtered.filter(r=>r.s==s);return{x:d.map(r=>r.x),y:d.map(r=>r.y),customdata:d.map(r=>[r.s,r.g,r.f]),name:'Seed '+s,mode:'markers',type:'scatter',marker:{color:C[s],size:d.map(r=>r.f===hi?14:6),opacity:d.map(r=>hi?(r.f===hi?1:.1):.72)},hovertemplate:'Seed %{customdata[0]} · Gene %{customdata[1]}<br>%{customdata[2]}<br>(%{x:.3f}, %{y:.3f})<extra></extra>'}});const f=rows.filter(r=>r.f===hi&&active.has(String(r.s))).sort((a,b)=>a.s-b.s);if(f.length)traces.push({x:f.map(r=>r.x),y:f.map(r=>r.y),mode:'lines',line:{color:'white',dash:'dot'},showlegend:false,hoverinfo:'skip'});Plotly.react('plot',traces,{paper_bgcolor:'#070b14',plot_bgcolor:'#0d1626',font:{color:'#dbe4f0'},margin:{l:50,r:20,t:20,b:50},xaxis:{title:'UMAP 1',gridcolor:'#20314d'},yaxis:{title:'UMAP 2',gridcolor:'#20314d'},legend:{orientation:'h'},dragmode:'pan'},{responsive:true,displaylogo:false,scrollZoom:true});status.textContent=filtered.length.toLocaleString()+' points'+(hi?' · '+hi+' ('+f.length+'/5 seeds)':'')}
mode.onchange=draw;go.onclick=()=>{hi=family(query.value);query.value=hi;draw()};query.onkeydown=e=>{if(e.key==='Enter')go.click()};reset.onclick=()=>{hi='';query.value='';draw()};fetch('seed_stability_feature_umap.csv').then(r=>r.text()).then(t=>{rows=parse(t);draw()}).catch(e=>status.innerHTML='<span class="error">Load failed: '+e+'</span>');
</script></body></html>
