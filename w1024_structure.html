<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>W1024 Statistical Structure Audit</title>
<style>
:root{--bg:#070b14;--panel:#0d1626;--panel2:#121f34;--line:#20314d;--text:#dbe4f0;--muted:#8a9bb5;--cyan:#39d6ff;--green:#22e0a1;--yellow:#f6c945;--red:#ff7488;--purple:#a58bff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}button,select,input,.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit}.btn{font-size:12px}header{height:55px;display:flex;align-items:center;gap:10px;padding:0 17px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;background:#070b14ee;backdrop-filter:blur(10px)}header h1{font-size:17px;margin:0}.grow{flex:1}.wrap{max-width:1500px;margin:auto;padding:18px}.headline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.headline h2{margin:0}.tag{display:inline-block;padding:2px 8px;border-radius:12px;background:#182943;color:var(--muted);font-size:10px}.note,.muted{color:var(--muted)}.note{font-size:12px;line-height:1.65}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.tabs button.active{color:var(--cyan);border-color:var(--cyan)}.kpis{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--muted);font-size:10px}.kpi b{display:block;font-size:19px;color:var(--cyan)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px;min-width:0}.box h3{margin:0 0 9px;font-size:13px;color:var(--cyan)}.metric{display:grid;grid-template-columns:minmax(150px,1fr) 2fr 55px;gap:8px;align-items:center;font-size:11px;margin:7px 0}.bar{height:7px;background:#17263e;border-radius:5px;overflow:hidden}.bar i{height:100%;display:block;background:linear-gradient(90deg,var(--purple),var(--cyan))}.work{display:grid;grid-template-columns:minmax(580px,1.6fr) minmax(300px,.8fr);gap:13px}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.table-scroll{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;font-size:11px}th,td{padding:7px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{position:sticky;top:0;background:#111d30;color:var(--muted);z-index:1}tbody tr{cursor:pointer}tbody tr:hover{background:#14243a}.stable{color:var(--green)}.warn{color:var(--yellow)}.bad{color:var(--red)}.detail{position:sticky;top:73px;align-self:start}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px}.card{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0a1220;cursor:pointer}.card.canonical{border-color:var(--green)}.card img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.card .cap{padding:6px;color:var(--muted);font-size:9px}.card .cap b{color:white;font-size:11px}.path{color:var(--cyan);font-size:10px;word-break:break-all}.dag-scroll{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:8px;background:#09111e}#dag{display:block;min-width:740px}.dag-link{fill:none;stroke:#355274;stroke-width:1.3}.dag-node circle{fill:var(--yellow);stroke:#07101d;stroke-width:2}.dag-node text{fill:var(--text);font-size:10px;dominant-baseline:middle}.finding{border-left:3px solid var(--cyan);padding:7px 10px;background:#0b1423;margin:8px 0;font-size:12px;line-height:1.55}.empty{padding:50px;color:var(--muted)}
@media(max-width:1000px){.work,.grid2,.grid3{grid-template-columns:1fr}.detail{position:static}}
</style>
</head>
<body>
<header><h1>W1024 · Statistical Structure Audit</h1><span class="tag">No manual labels · No VLM</span><span class="grow"></span><a class="btn" href="w1024_statistics.html">lineage tree</a><a class="btn" href="genes.html">Gene Browser</a></header>
<main class="wrap"><div id="app" class="empty">Loading structural analysis...</div></main>
<script>
let A,M,E,MODE="overview",SELECTED=null;
const $=s=>document.querySelector(s),fmt=x=>Number(x).toFixed(3),pct=x=>(100*Number(x)).toFixed(1)+"%";
const statusZh={robust_structured:"stable structure",robust_specific:"Stable and specific",supported_mixed:"Supported·Mixed",weak_evidence:"The evidence is weak",unstable_evidence:"unstable",nuisance_component:"location/quality nuisance",redundant_variant:"redundant variant",stable_dominant:"Stable dominance",nuisance_dominant:"nuisance dominance",city_specific_dominant:"city-specific dominance",mixed:"mix"};
Promise.all([
 fetch("w1024_statistical/structure_analysis.json").then(x=>x.json()),
 fetch("w1024_statistical/gene_metrics.json").then(x=>x.json()),
 fetch("genes_batchtopk_w1024_k8/manifest.json").then(x=>x.json()),
]).then(x=>{[A,M,E]=x;render()}).catch(e=>app.innerHTML=`<div class="empty">Loading failed: ${e}</div>`);
function tabs(){return`<div class="tabs">${[["overview","Overview"],["branches","Branch Audit"],["equivalence","equivalent redundancy"],["specialization","upper and lower level DAG"]].map(([k,n])=>`<button class="${MODE===k?'active':''}" onclick="MODE='${k}';SELECTED=null;render()">${n}</button>`).join("")}</div>`}
function shell(content){app.className="";app.innerHTML=`<div class="headline"><h2>Statistical Structure Audit</h2><span class="tag">1024 genes</span><span class="tag">5 evidence axes</span></div><p class="note">Here we only judge the strength of evidence, nuisance, redundancy and superior and subordinate structures, and do not generate natural language semantic names. Reliability and structure come from empirical quantiles; they are not artificial labels.</p>${tabs()}${content}`}
function metric(name,value,max){return`<div class="metric"><span>${name}</span><span class="bar"><i style="width:${100*value/max}%"></i></span><b>${value}</b></div>`}
function card(id,canonical=false){const g=M[String(id)],a=A.gene_evidence[String(id)],im=E.genes[String(id)]?.ex?.[0];return`<div class="card ${canonical?'canonical':''}" onclick="location.href='w1024_statistics.html'"><img loading="lazy" src="${im||''}"><div class="cap"><b>#${id}${canonical?' · canonical':''}</b><br>${statusZh[a.evidence_status]}<br>${g.fine_cluster} · ${g.granularity_level}<br>R ${fmt(a.reliability)} · S ${fmt(a.structure)}</div></div>`}
function render(){if(!A)return;if(MODE==="overview")overview();if(MODE==="branches")branches();if(MODE==="equivalence")equivalence();if(MODE==="specialization")specialization()}
function overview(){const s=A.summary,e=s.equivalence,d=s.specialization,f=s.branch_status_by_level.fine;shell(`<div class="kpis"><div class="kpi"><b> ${e.strict_effective_dictionary_size} </b>Candidate dimensions after strict redundancy removal</div><div class="kpi"><b> ${f.stable_dominant} </b>Stable dominant F branch</div><div class="kpi"><b> ${f.nuisance_dominant} </b>nuisance dominant F clade</div><div class="kpi"><b> ${d.direct_edges} </b>Directly specializes edges</div><div class="kpi"><b> ${d.components} </b>Upper and lower level components</div></div><div class="grid2"><div class="box"><h3>Gene Evidence Status</h3> ${Object.entries(s.evidence_status_counts).map(([k,v])=>metric(statusZh[k],v,s.n_genes)).join("")} </div><div class="box"><h3>F branch state</h3> ${Object.entries(f).map(([k,v])=>metric(statusZh[k],v,64)).join("")} </div></div><div class="grid3" style="margin-top:13px"><div class="box"><h3>branch quality</h3><div class="finding">Among the 64 F, ${f.stable_dominant} is stable and dominant, ${f.nuisance_dominant} is nuisance dominant, ${f.city_specific_dominant} is city-specific dominant, and the remaining ${f.stable_dominant}0 are mixed structures.</div></div><div class="box"><h3>redundancy boundary</h3><div class="finding">Relaxed connected components will get the ${f.stable_dominant}1 dimension; after requiring the same F and any two points in the group fused≥0.4, it is only recommended to first review the ${f.stable_dominant}2 group and ${f.stable_dominant}3 redundant variants, corresponding to the ${f.stable_dominant}4 dimension.</div></div><div class="box"><h3>superior-subordinate structure</h3><div class="finding">${f.stable_dominant}5 out of 339 specializes is transitively derivable; retained ${f.stable_dominant}6 A direct edge. The longest chain is ${f.stable_dominant}7. </div></div></div><div class="box" style="margin-top:13px"><h3>five independent axes of evidence</h3><p class="note"><b>Reliability</b>: Stability and support amount;<b>Structure</b>: Fusion of proximity, spatial aggregation and adjacent continuity;<b>Nuisance risk</b>: The maximum value of position, mass, and instability probability;<b>Specificity</b>: City-specific or rare probability;<b>Redundancy</b>: Whether to enter the strict equivalence group. Don't think of any axis alone as a "semantic score."</p></div>`)}
function branches(){const levels=[...new Set(A.branches.map(x=>x.level))],statuses=[...new Set(A.branches.map(x=>x.branch_status))];shell(`<div class="work"><div class="box"><div class="controls"><select id="bl" onchange="branchTable()"><option value="fine">F branch</option><option value="coarse">C thick branch</option></select><select id="bs" onchange="branchTable()"><option value="">All status</option>${statuses.map(x=>`<option value="${x}">${statusZh[x]}</option>`).join("")}</select><select id="bo" onchange="branchTable()"><option value="stable_fraction">According to stable ratio</option><option value="nuisance_fraction">in proportion to nuisance</option><option value="role_purity">Purity by role</option><option value="branch_stability">By branch stability</option></select></div><div class="table-scroll"><table><thead><tr><th>branch</th><th>state</th><th>N</th><th>dominant role</th><th>purity</th><th>Stablize</th><th>Nuisance</th><th>Medoid</th></tr></thead><tbody id="bt"></tbody></table></div></div><div id="bd" class="box detail"><p class="note">Click on a branch to view the evidence component.</p></div></div>`);branchTable()}
function branchTable(){let rows=A.branches.filter(x=>x.level==bl.value&&(!bs.value||x.branch_status==bs.value));rows.sort((a,b)=>b[bo.value]-a[bo.value]);bt.innerHTML=rows.map(x=>`<tr onclick="showBranch('${x.branch_id}')"><td><b>${x.branch_id}</b></td><td>${statusZh[x.branch_status]}</td><td>${x.n_genes}</td><td>${x.dominant_role}</td><td>${pct(x.role_purity)}</td><td class="stable">${pct(x.stable_fraction)}</td><td class="bad">${pct(x.nuisance_fraction)}</td><td>#${x.medoid_gene}</td></tr>`).join("")}
function showBranch(id){const b=A.branches.find(x=>x.branch_id==id);bd.innerHTML=`<h3>${b.branch_id} · ${statusZh[b.branch_status]}</h3><div class="path">${b.level} · medoid #${b.medoid_gene}</div><div class="kpis"><div class="kpi"><b>${pct(b.stable_fraction)}</b>stable</div><div class="kpi"><b>${pct(b.nuisance_fraction)}</b>nuisance</div><div class="kpi"><b>${fmt(b.role_purity)}</b>role purity</div><div class="kpi"><b>${fmt(b.branch_stability)}</b>stability</div></div><p class="note">${Object.entries(b.role_counts).map(([k,v])=>`${k}: ${v}`).join(' · ')}</p><div class="cards">${[b.medoid_gene,...b.genes.filter(x=>x!=b.medoid_gene).sort((a,c)=>A.gene_evidence[String(c)].reliability-A.gene_evidence[String(a)].reliability).slice(0,7)].map(x=>card(x,x==b.medoid_gene)).join("")}</div>`}
function equivalence(){const e=A.summary.equivalence;shell(`<div class="kpis"><div class="kpi"><b>${e.groups}</b>loose equivalent weight</div><div class="kpi"><b>${e.genes_in_groups}</b>involving genes</div><div class="kpi"><b>${e.cross_fine_groups}</b>Across F components</div><div class="kpi"><b>${e.strict_groups}</b>strict candidate group</div><div class="kpi"><b>${e.strict_effective_dictionary_size}</b>Strict candidate valid dimensions</div></div><div class="work"><div class="box"><div class="controls"><select id="eqf" onchange="eqTable()"><option value="strict">Strict candidates only</option><option value="all">all connected components</option><option value="cross">Only across F risk groups</option></select></div><div class="table-scroll"><table><thead><tr><th>Group</th><th>N</th><th>Canonical</th><th>across F</th><th>min fused</th><th>stable ratio</th></tr></thead><tbody id="eqt"></tbody></table></div></div><div id="eqd" class="box detail"><p class="note">Strict candidates require members to be in the same F branch and the fused similarity of any two points in the group ≥ 0.4. Click on a group to view its members.</p></div></div>`);eqTable()}
function eqTable(){let rows=A.equivalence_groups.filter(x=>eqf.value==="all"||eqf.value==="strict"&&x.strict_collapse_candidate||eqf.value==="cross"&&x.cross_fine);eqt.innerHTML=rows.map(x=>`<tr onclick="showEq(' ${x.group_id} ')"><td><b> ${x.group_id} </b></td><td> ${x.n_members} </td><td># ${x.canonical_gene} </td><td> ${x.cross_fine?'Yes':'No'} </td><td> ${fmt(x.min_pair_fused)} </td><td> ${pct(x.stable_fraction)} </td></tr>`).join("")}
function showEq(id){const g=A.equivalence_groups.find(x=>x.group_id==id);eqd.innerHTML=`<h3> ${g.group_id} · ${g.strict_collapse_candidate?'Strict candidate':'Review with caution'} </h3><div class="path">canonical # ${g.canonical_gene} · ${g.fine_clusters.join(' / ')} </div><p class="note">Within group fused: mean ${fmt(g.mean_pair_fused)} · min ${fmt(g.min_pair_fused)} . ${g.cross_fine?'This group crosses F branches and may reflect chained similarity, so it should not be collapsed wholesale.':'Members belong to the same F branch.'} </p><div class="cards"> ${g.members.map(x=>card(x,x==g.canonical_gene)).join("")} </div>`}
function specialization(){const s=A.summary.specialization;shell(`<div class="kpis"><div class="kpi"><b>${s.nodes}</b>Participate in gene</div><div class="kpi"><b>${s.direct_edges}</b>Directly between father and son</div><div class="kpi"><b>${s.implied_edges_removed}</b>Remove transitive edge</div><div class="kpi"><b>${s.components}</b>DAG component</div><div class="kpi"><b>${s.longest_chain_edges}</b>Number of longest chain edges</div></div><div class="work"><div class="box"><div class="table-scroll"><table><thead><tr><th>weight</th><th>Genes</th><th>Edges</th><th>longest chain</th><th>F</th></tr></thead><tbody>${A.specialization_components.map(x=>`<tr onclick="showDag('${x.component_id}')"><td><b>${x.component_id}</b></td><td>${x.n_members}</td><td>${x.n_direct_edges}</td><td>${x.longest_path.map(g=>'#'+g).join(' → ')}</td><td>${x.fine_clusters.join('/')}</td></tr>`).join("")}</tbody></table></div></div><div id="sd" class="box detail"><p class="note">The direction is "specific gene → more general gene". Click components to draw direct parent-child DAGs.</p></div></div>`)}
function showDag(id){const c=A.specialization_components.find(x=>x.component_id==id),member=new Set(c.members),edges=A.specialization_direct_edges.filter(x=>member.has(x.child_gene)&&member.has(x.parent_gene));sd.innerHTML=`<h3> ${c.component_id} </h3><div class="path">Specific → General · ${c.fine_clusters.join(' / ')} </div><p class="note">General root: ${c.general_roots.map(x=>'#'+x).join(' · ')} <br>Specific leaf: ${c.specific_leaves.map(x=>'#'+x).join(' · ')} </p><div class="dag-scroll"><svg id="dag"></svg></div>`;drawDag(c.members,edges)}
function drawDag(members,edges){const rank=Object.fromEntries(members.map(x=>[x,0]));for(let pass=0;pass<members.length;pass++)for(const e of edges)rank[e.parent_gene]=Math.max(rank[e.parent_gene],rank[e.child_gene]+1);const groups={};for(const g of members)(groups[rank[g]]??=[]).push(g);const pos={},gap=42;let maxRows=0;for(const [r,gs] of Object.entries(groups)){gs.sort((a,b)=>a-b);maxRows=Math.max(maxRows,gs.length);gs.forEach((g,i)=>pos[g]={x:55+Number(r)*185,y:30+i*gap})}const width=180+Math.max(...Object.values(rank))*185,height=Math.max(220,50+maxRows*gap);dag.setAttribute("viewBox",`0 0 ${width} ${height}`);dag.setAttribute("width",width);dag.setAttribute("height",height);dag.innerHTML=`<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#355274"/></marker></defs>`+edges.map(e=>{const a=pos[e.child_gene],b=pos[e.parent_gene],m=(a.x+b.x)/2;return`<path class="dag-link" marker-end="url(#arrow)" d="M${a.x},${a.y} C${m},${a.y} ${m},${b.y} ${b.x},${b.y}"/>`}).join("")+members.map(g=>`<g class="dag-node" transform="translate(${pos[g].x},${pos[g].y})"><circle r="7"></circle><text x="12">#${g} · ${M[String(g)].granularity_level}</text></g>`).join("")}
</script>
</body></html>
